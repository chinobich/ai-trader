try{

  if(th === 'auto') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', th);
  if(p.lite) document.documentElement.classList.add('lite');
}catch(e){}

<style>
/* ============================================================
   Tokens — "モヤが晴れていく空"
   ============================================================ */
:root{
  --font:"BIZ UDPGothic","Meiryo UI","Yu Gothic UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --clear:.3;

  --ink:#1d2433;
  --ink-2:#4f586b;
  --ink-3:#848da0;
  --glass:rgba(255,255,255,.60);
  --glass-strong:rgba(255,255,255,.80);
  --glass-border:rgba(255,255,255,.78);
  --solid:#f7f8fb;
  --line:rgba(30,40,70,.10);
  --line-2:rgba(30,40,70,.06);
  --hover:rgba(255,255,255,.62);

  --accent:#4c68d6;
  --accent-2:#3b55c2;
  --accent-soft:rgba(76,104,214,.12);
  --accent-ink:#ffffff;
  --accent-grad:linear-gradient(135deg,#5a7ce2 0%,#7d6bdc 100%);
  --red:#cf4646;
  --red-soft:rgba(207,70,70,.11);
  --amber:#9a640f;
  --amber-soft:rgba(214,150,40,.16);
  --green:#1f845a;
  --green-soft:rgba(31,132,90,.12);
  --violet:#7350c8;
  --violet-soft:rgba(115,80,200,.11);
  --sun-ink:#e59a2f;

  --sky-a:#d5dbe4;
  --sky-b:#e6e5e2;
  --sky-c:#efece7;
  --clear-a:#93c2ee;
  --clear-b:#cbe2f6;
  --clear-c:#fbf2e3;
  --fog:rgba(255,255,255,.96);
  --sun:rgba(255,207,128,.62);
  --stars:0;

  --toast:rgba(29,36,51,.92);
  --toast-ink:#f4f6fb;
  --shadow-sm:0 1px 2px rgba(30,40,70,.06);
  --shadow:0 1px 2px rgba(30,40,70,.05),0 12px 32px -14px rgba(30,40,70,.22);
  --shadow-lg:0 2px 6px rgba(30,40,70,.06),0 30px 80px -20px rgba(30,40,70,.38);
  --r:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#e8ebf3;
  --ink-2:#aab2c4;
  --ink-3:#737c91;
  --glass:rgba(26,30,44,.58);
  --glass-strong:rgba(30,35,52,.86);
  --glass-border:rgba(255,255,255,.07);
  --solid:#1a1e2b;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.05);
  --hover:rgba(255,255,255,.05);

  --accent:#93a6ff;
  --accent-2:#aebcff;
  --accent-soft:rgba(147,166,255,.15);
  --accent-ink:#0f1430;
  --accent-grad:linear-gradient(135deg,#7f97ff 0%,#a68bff 100%);
  --red:#ff7f78;
  --red-soft:rgba(255,127,120,.13);
  --amber:#f2b552;
  --amber-soft:rgba(242,181,82,.13);
  --green:#52cc94;
  --green-soft:rgba(82,204,148,.13);
  --violet:#b99dff;
  --violet-soft:rgba(185,157,255,.13);
  --sun-ink:#f6c56d;

  --sky-a:#161a24;
  --sky-b:#1b1e29;
  --sky-c:#21232d;
  --clear-a:#08152b;
  --clear-b:#122546;
  --clear-c:#2b2c4a;
  --fog:rgba(150,160,188,.17);
  --sun:rgba(150,170,255,.20);
  --stars:1;

  --toast:rgba(236,239,247,.94);
  --toast-ink:#151926;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 32px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 30px 80px -20px rgba(0,0,0,.75);
  color-scheme:dark;
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink);background:var(--sky-b);
  font:15px/1.7 var(--font);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
  overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
kbd{
  font:11px/1 var(--font);font-feature-settings:normal;
  padding:3px 6px;border-radius:6px;border:1px solid var(--line);
  background:var(--glass-strong);color:var(--ink-3);
  white-space:nowrap;
}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.35);
  backdrop-filter:blur(22px) saturate(1.35);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow);
}

/* ============================================================
   Sky
   ============================================================ */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%)}
.sky > div{position:absolute;pointer-events:none}
.sky-clear{inset:0;background:linear-gradient(180deg,var(--clear-a) 0%,var(--clear-b) 48%,var(--clear-c) 100%);opacity:var(--clear);transition:opacity 2.2s ease}
.sky-sun{right:-14vw;top:-28vh;width:78vw;height:78vh;background:radial-gradient(closest-side,var(--sun),rgba(255,255,255,0));opacity:var(--clear);transition:opacity 2.2s ease}
.sky-stars{
  inset:0;opacity:calc(var(--clear) * var(--stars) * .9);transition:opacity 2.2s ease;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 120px 80px,#dfe6ff,transparent),
    radial-gradient(1.4px 1.4px at 230px 40px,#fff,transparent),
    radial-gradient(1px 1px at 300px 150px,#fff,transparent),
    radial-gradient(1.2px 1.2px at 60px 190px,#e8ecff,transparent),
    radial-gradient(1px 1px at 370px 220px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 180px 250px,#fff,transparent);
  background-size:420px 300px;
}
.fog{
  border-radius:50%;
  background:radial-gradient(closest-side,var(--fog),rgba(255,255,255,0));
  opacity:calc(1 - var(--clear) * .9);
  transition:opacity 2.6s ease;
  animation:drift 56s ease-in-out infinite alternate;
  will-change:transform;
}
.fog-1{left:-24vw;top:-14vh;width:86vw;height:56vh}
.fog-2{right:-28vw;top:16vh;width:80vw;height:52vh;animation-duration:74s;animation-direction:alternate-reverse}
.fog-3{left:-6vw;bottom:-24vh;width:110vw;height:58vh;animation-duration:64s}
.fog-4{left:34vw;top:38vh;width:62vw;height:42vh;animation-duration:90s;animation-direction:alternate-reverse}
.fog-5{left:4vw;top:30vh;width:48vw;height:30vh;animation-duration:48s}
@keyframes drift{
  from{transform:translate3d(-7vw,0,0) scale(1)}
  to{transform:translate3d(7vw,-3vh,0) scale(1.1)}
}
html.lite .fog{animation:none}
html.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}

/* ============================================================
   Layout
   ============================================================ */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:4px;
  padding:24px 14px 16px;
  border-width:0 1px 0 0;border-radius:0;box-shadow:none;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 22px;font-weight:700;font-size:16px;letter-spacing:.04em}
.brand .logo{
  width:32px;height:32px;border-radius:10px;background:var(--accent-grad);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(90,110,220,.8);
}
.brand .logo .ic{width:18px;height:18px;stroke-width:2.6}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-top:-1px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px 9px 12px;border-radius:12px;color:var(--ink-2);text-align:left;
  transition:background .2s,color .2s,box-shadow .2s;
}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item .label{flex:1}
.nav-item .count{min-width:22px;padding:0 7px;height:20px;border-radius:999px;font-size:12px;line-height:20px;text-align:center;color:var(--ink-3)}
.nav-item.active{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:700}
.nav-item.active .ic{color:var(--accent)}
.nav-item .count.alert{background:var(--red-soft);color:var(--red);font-weight:700}
.nav-item .count.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}

.focus-btn{
  margin:20px 0 0;display:flex;align-items:center;gap:10px;justify-content:center;
  padding:12px 14px;border-radius:14px;font-weight:700;color:#fff;
  background:var(--accent-grad);box-shadow:0 10px 24px -12px rgba(90,110,220,.9);
  transition:transform .2s,box-shadow .2s;
}
.focus-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(90,110,220,1)}
.focus-btn kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.backup-note{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;
  font-size:12px;color:var(--ink-3);text-align:left;line-height:1.45;
}
.backup-note:hover{background:var(--hover);color:var(--ink-2)}
.backup-note.warn{color:var(--amber);background:var(--amber-soft)}
.backup-note.err{color:var(--red);background:var(--red-soft)}
.foot-row{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink-3);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}

.main{width:100%;max-width:880px;margin:0 auto;padding:40px 44px 160px}

/* ============================================================
   Header + weather
   ============================================================ */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}
.date{font-size:13px;color:var(--ink-3);letter-spacing:.06em}
.greet{margin:4px 0 6px;font-size:30px;line-height:1.3;font-weight:700;letter-spacing:.03em}
.sub{margin:0;color:var(--ink-2);font-size:14px}
.sub b{color:var(--ink)}
.sub .over{color:var(--red);font-weight:700}
.sub .nw{white-space:nowrap}
.weather{
  flex:none;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:20px;min-width:228px;
}
.wx-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--glass-strong);flex:none}
.wx-ic svg{width:34px;height:34px}
.wx-label{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.wx-state{font-size:17px;font-weight:700;line-height:1.35;letter-spacing:.04em}
.wx-bar{width:120px;height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.wx-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#9fb3e6,#f2c06b);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.wx-sub{font-size:11.5px;color:var(--ink-3)}
.wx-fog line{stroke:var(--ink-3)}
.wx-sunc{fill:var(--sun-ink);stroke:none}
.wx-ray{stroke:var(--sun-ink)}
.wx-cloud{fill:var(--glass-strong);stroke:var(--ink-3)}
.wx-spin{transform-origin:24px 24px;animation:spin 24s linear infinite}
.wx-spin.p{transform-origin:30px 17px}

/* ============================================================
   Composer
   ============================================================ */
.composer{position:sticky;top:0;z-index:5;padding:12px 0 0;margin:-12px 0 0}
.input-wrap{
  display:flex;align-items:flex-start;gap:12px;
  padding:15px 16px 15px 18px;border-radius:20px;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.input-wrap:focus-within{border-color:rgba(110,130,230,.55);box-shadow:0 0 0 5px var(--accent-soft),var(--shadow);background:var(--glass-strong)}
.input-wrap .plus{
  width:26px;height:26px;margin-top:1px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-grad);color:#fff;
}
.input-wrap .plus .ic{width:15px;height:15px;stroke-width:2.6}
#input{
  flex:1;border:0;background:transparent;resize:none;outline:none;
  font-size:16px;line-height:1.65;min-height:26px;max-height:220px;padding:0;overflow-y:auto;
}
#input::placeholder{color:var(--ink-3)}
.input-wrap kbd{margin-top:3px;transition:opacity .2s}
.input-wrap:not(:focus-within) kbd{opacity:0}
.preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px;padding:8px 6px 0;margin-bottom:16px;font-size:12.5px;color:var(--ink-3)}
.preview .hint b{color:var(--ink-2);font-weight:700}

/* ============================================================
   Chips
   ============================================================ */
.chip{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;
  font-size:12px;line-height:22px;white-space:nowrap;
  background:var(--glass-strong);color:var(--ink-2);border:1px solid var(--line-2);
}
.chip .ic{width:13px;height:13px;stroke-width:2}
.chip.over{background:var(--red-soft);color:var(--red);border-color:transparent;font-weight:700}
.chip.today{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
.chip.urgent{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.wait{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.wait.long{font-weight:700}
.chip.someday{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.chip.recur{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.ghost{background:transparent;border-color:transparent;padding:0 4px;color:var(--ink-3)}
.chip.link{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.chip.prog{cursor:pointer}
button.chip.prog:hover{box-shadow:0 0 0 1px var(--accent)}
.chip.prog.full{background:var(--green-soft);color:var(--green)}
.cat{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;white-space:nowrap;
  background:hsl(var(--h) 70% 52% / .12);color:hsl(var(--h) 48% 34%);
}
.cat i{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 62% 56%);flex:none}
:root[data-theme="dark"] .cat{background:hsl(var(--h) 60% 62% / .14);color:hsl(var(--h) 72% 78%)}
button.cat{cursor:pointer}
button.cat:hover{box-shadow:0 0 0 1px hsl(var(--h) 62% 56% / .6)}

/* ============================================================
   Insight card (analysis result)
   ============================================================ */
.insight{
  position:relative;margin:4px 0 22px;padding:16px 18px 14px;border-radius:20px;overflow:hidden;
  animation:clearIn .7s cubic-bezier(.2,.8,.2,1);
}
.insight::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent-grad);opacity:.85}
.ins-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-right:36px}
.ins-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-grad);color:#fff;flex:none}
.ins-ic .ic{width:16px;height:16px}
.ins-head b{font-size:14.5px;letter-spacing:.03em;white-space:nowrap}
.ins-head .ins-title{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.ins-k{font-size:12px;color:var(--ink-3);padding-top:2px;letter-spacing:.04em}
.ins-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--ink-2)}
.ins-v b{color:var(--ink)}
.ins-subs{display:flex;flex-direction:column;gap:2px;width:100%}
.sub-item{
  position:relative;display:flex;align-items:center;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;
  transition:background .15s;
}
.sub-item:hover{background:var(--hover)}
.sub-item input{position:absolute;opacity:0;pointer-events:none}
.sub-box{width:18px;height:18px;border-radius:6px;border:1.6px solid var(--ink-3);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.sub-box .ic{width:12px;height:12px;stroke-width:3}
.sub-item input:checked + .sub-box{background:var(--accent);border-color:var(--accent);color:#fff}
.sub-item input:focus-visible + .sub-box{outline:2px solid var(--accent);outline-offset:2px}
.sub-name{flex:1;color:var(--ink)}
.sub-item input:not(:checked) ~ .sub-name{color:var(--ink-3)}
.sub-due{font-size:12px;color:var(--ink-3)}
.ins-note{font-size:12px;color:var(--ink-3);margin-top:4px}
.linkbtn{color:var(--accent);font-weight:700;font-size:12.5px;padding:2px 4px;border-radius:6px}
.linkbtn:hover{background:var(--accent-soft)}
.ins-close{position:absolute;top:10px;right:10px}

/* ============================================================
   Banner / buttons
   ============================================================ */
.banner{
  display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:12px 12px 12px 14px;border-radius:18px;
  animation:clearIn .6s cubic-bezier(.2,.8,.2,1);
}
.banner .b-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);flex:none}
.banner .b-txt{flex:1;font-size:14px;line-height:1.5}
.banner .b-txt b{display:block}
.banner .b-txt span{font-size:12.5px;color:var(--ink-2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:11px;
  font-size:13.5px;font-weight:700;white-space:nowrap;
  background:var(--glass-strong);color:var(--ink);border:1px solid var(--line);
  transition:background .15s,transform .1s,border-color .15s,box-shadow .15s;
}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(90,110,220,.9)}
.btn.primary:hover{box-shadow:0 10px 24px -10px rgba(90,110,220,1);filter:brightness(1.05)}
.btn.danger{color:var(--red)}
.btn.danger-fill{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:9px}
.btn .ic{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============================================================
   View head & groups
   ============================================================ */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 16px}
.view-head h2{margin:0;font-size:20px;line-height:1.3;letter-spacing:.04em}
.view-head p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.view-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow-sm)}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:9px;font-size:12.5px;color:var(--ink-2);transition:background .2s,color .2s;white-space:nowrap}
.seg button .ic{width:14px;height:14px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--glass-strong);color:var(--ink);font-weight:700;box-shadow:var(--shadow-sm)}

.group{margin:0 0 22px}
.group-row{display:flex;align-items:center;gap:8px}
.group-row .group-head{flex:1}
.group-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px 8px;
  font-size:13px;color:var(--ink-2);text-align:left;
}
.group-head .ic{width:14px;height:14px;transition:transform .25s;color:var(--ink-3)}
.group-head.open .chev{transform:rotate(90deg)}
.group-head b{color:var(--ink);font-size:14px;letter-spacing:.03em}
.group-head.k-overdue b{color:var(--red)}
.group-head .gdot{width:9px;height:9px;border-radius:50%;flex:none;background:hsl(var(--h) 62% 56%);box-shadow:0 0 0 4px hsl(var(--h) 62% 56% / .16)}
.group-head .gcount{color:var(--ink-3)}
.group-head .gsub{color:var(--ink-3);font-size:12px;margin-left:2px}
.gcopy{margin-bottom:6px}

.card{border-radius:var(--r);overflow:hidden}
.tasks{list-style:none;margin:0;padding:0}

/* ============================================================
   Task row
   ============================================================ */
.task{
  position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:start;gap:8px;
  padding:12px 12px 12px 16px;border-top:1px solid var(--line-2);
  transition:background .2s;
}
.task:first-child{border-top:0}
.task:hover,.task:focus-within{background:var(--hover)}
.task:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0}
.task.urgent::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.task.child{padding-left:46px}
.task.child::after{content:"";position:absolute;left:27px;top:0;bottom:0;width:1.5px;background:var(--line)}
.task.child.last::after{bottom:auto;height:24px}
.task.enter{animation:clearIn .8s cubic-bezier(.2,.8,.2,1) both}
.task.flash{animation:flash 1.6s ease}

.check{
  width:22px;height:22px;margin-top:2px;border-radius:50%;
  border:1.8px solid var(--ink-3);display:grid;place-items:center;color:transparent;background:var(--glass-strong);
  transition:border-color .15s,background .15s,color .15s,transform .15s;
}
.check .ic{width:13px;height:13px;stroke-width:3}
.check:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.task.urgent .check{border-color:var(--red)}
.task.is-done .check,.task.completing .check{background:var(--green);border-color:var(--green);color:#fff}
.task.completing .check{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.task.completing .t-title{color:var(--ink-3);text-decoration:line-through}
.task.leaving{transition:max-height .45s ease,opacity .45s ease,padding .45s ease,filter .45s ease,transform .45s ease;opacity:0;filter:blur(8px);transform:translateY(-6px);padding-top:0;padding-bottom:0;overflow:hidden}

.t-body{min-width:0}
.t-title{word-break:break-word;font-size:15px;line-height:1.6;cursor:text}
.task.is-done .t-title{color:var(--ink-3);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.t-meta:empty{display:none}
.t-edit{
  width:100%;font-size:15px;line-height:1.6;padding:2px 8px;margin:-3px 0 -3px -9px;
  border:1.5px solid var(--accent);border-radius:9px;background:var(--glass-strong);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.t-note{margin-top:8px}
.t-note textarea{
  width:100%;min-height:76px;resize:vertical;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--glass-strong);font-size:13.5px;line-height:1.65;
}
.t-note textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.t-note .saved{font-size:11px;color:var(--ink-3);height:16px;margin-top:2px}

.t-actions{display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .2s}
.task:hover .t-actions,.task:focus-within .t-actions,.task:focus .t-actions{opacity:1}
@media (hover:none){.t-actions{opacity:1}}
.qa{
  height:28px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink-2);
  background:var(--glass-strong);border:1px solid var(--line);white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.qa:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.qa.go{color:var(--green)}
.qa.go:hover{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.more{width:30px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.more:hover{background:var(--line-2);color:var(--ink)}

/* ============================================================
   Empty state
   ============================================================ */
.empty{padding:50px 26px 40px;text-align:center;color:var(--ink-2)}
.empty .art{width:96px;height:96px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;background:var(--glass-strong);box-shadow:var(--shadow-sm);color:var(--accent)}
.empty .art svg{width:58px;height:58px}
.empty .art .ic{width:40px;height:40px;stroke-width:1.5}
.empty h3{margin:0 0 8px;color:var(--ink);font-size:18px;letter-spacing:.04em}
.empty p{margin:0 auto;max-width:520px;font-size:13.5px;text-wrap:balance}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.example{
  padding:7px 13px;border-radius:12px;font-size:13px;background:var(--glass-strong);border:1px dashed var(--line);color:var(--ink-2);
  transition:border-color .15s,color .15s,background .15s;
}
.example:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;text-align:left}
.tip{padding:13px 15px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line-2);font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.tip b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}

/* ============================================================
   Menu / toast / dialog
   ============================================================ */
.menu{
  position:fixed;z-index:50;min-width:230px;padding:6px;border-radius:16px;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--glass-border);box-shadow:var(--shadow-lg);
  animation:menuIn .18s cubic-bezier(.2,.8,.2,1);transform-origin:top right;
}
html.lite .menu{background:var(--solid)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;font-size:13.5px;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:none}
.menu button .ic{width:16px;height:16px;color:var(--ink-3)}
.menu button .k{margin-left:auto;font-size:11px;color:var(--ink-3)}
.menu button.danger,.menu button.danger .ic{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 4px}

.toast{
  position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:min(580px,calc(100vw - 32px));
  padding:11px 12px 11px 18px;border-radius:16px;background:var(--toast);color:var(--toast-ink);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow-lg);font-size:14px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;
}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .t-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{padding:5px 11px;border-radius:9px;font-weight:700;font-size:13px;color:var(--toast-ink);background:rgba(127,127,127,.24)}
.toast button:hover{background:rgba(127,127,127,.38)}

dialog{
  width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid var(--glass-border);border-radius:22px;
  background:var(--solid);color:var(--ink);box-shadow:var(--shadow-lg);
}
dialog[open]{animation:dlgIn .3s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(20,26,40,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
dialog.wide{width:min(680px,calc(100vw - 32px))}
.dlg{padding:24px 24px 20px}
.dlg h3{margin:0 0 4px;font-size:17px;letter-spacing:.03em}
.dlg .lead{margin:0 0 16px;font-size:13px;color:var(--ink-2)}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.dlg .foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.dlg .foot .spacer{flex:1}
.field{
  width:100%;height:42px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--glass-strong);font-size:15px;
}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.field{height:auto;min-height:280px;padding:12px;font-size:13px;line-height:1.75;resize:vertical;font-family:var(--font)}
.pick{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;border-radius:13px;min-width:94px;
  border:1px solid var(--line);background:var(--glass-strong);text-align:left;font-size:13.5px;font-weight:700;
  transition:border-color .15s,background .15s,color .15s;
}
.pick small{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.pick:hover,.pick.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sec{padding:14px 0;border-top:1px solid var(--line-2)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h4{margin:0 0 6px;font-size:14px}
.sec p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.switch{position:relative;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:13.5px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.help-table{width:100%;border-collapse:collapse;font-size:13px}
.help-table td{padding:7px 4px;border-top:1px solid var(--line-2);vertical-align:top}
.help-table td:first-child{white-space:nowrap;color:var(--ink);font-weight:700;padding-right:14px}
.help-table td:last-child{color:var(--ink-2)}
.help-table code{font-family:inherit;background:var(--glass-strong);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
.help-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.help-h{margin:0 0 6px;font-size:13px}
.dlg-list{display:flex;flex-direction:column;gap:2px;margin:0 0 6px}

/* ============================================================
   Focus mode — everything else dissolves into mist
   ============================================================ */
.focus{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;padding:24px;overflow-y:auto;
  background:radial-gradient(900px 520px at 50% 40%,var(--glass-strong),var(--glass) 70%);
  -webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);
  animation:fadeIn .4s ease;
}
html.lite .focus{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
.focus[hidden]{display:none}
.focus-close{position:absolute;top:18px;right:18px}
.focus-card{width:min(700px,100%);min-width:0;margin:auto;text-align:center}
.focus-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);letter-spacing:.1em}
.focus-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.focus-title{margin:20px 0 14px;font-size:clamp(24px,4vw,38px);line-height:1.45;font-weight:700;letter-spacing:.03em;word-break:break-word;animation:clearIn .9s cubic-bezier(.2,.8,.2,1)}
.focus-meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:22px}
.focus-note{margin:16px auto 0;max-width:540px;padding:12px 16px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);text-align:left;white-space:pre-wrap}
.focus-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:36px}
.focus-actions .btn{height:50px;padding:0 26px;font-size:15px;border-radius:16px}
.focus-actions .btn.primary{padding:0 34px}
.timer{margin:30px auto 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer-time{font-size:48px;font-weight:700;letter-spacing:.03em;line-height:1}
.timer-bar{width:240px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--accent-grad);border-radius:99px;transition:width 1s linear}
.timer.ring .timer-time{color:var(--green);animation:pulse 1s ease infinite}
.timer-picks{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.timer-picks button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);font-size:12.5px;color:var(--ink-2)}
.timer-picks button:hover{border-color:var(--accent);color:var(--accent)}
.focus-progress{display:flex;gap:5px;justify-content:center;margin-top:30px}
.focus-progress i{width:22px;height:4px;border-radius:9px;background:var(--line)}
.focus-progress i.cur{background:var(--accent);width:34px}
.focus-hint{margin-top:16px;font-size:12px;color:var(--ink-3)}

#burst{position:fixed;inset:0;pointer-events:none;z-index:70}
.glow{position:fixed;inset:0;pointer-events:none;z-index:69;background:radial-gradient(60vw 60vh at 50% 30%,rgba(255,226,160,.55),rgba(255,226,160,0));animation:glow 2.4s ease forwards}

/* ============================================================
   Motion
   ============================================================ */
@keyframes clearIn{
  0%{opacity:0;filter:blur(10px);transform:translateY(-6px) scale(.99)}
  60%{opacity:1}
  100%{opacity:1;filter:blur(0);transform:none}
}
@keyframes flash{0%,45%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;filter:blur(6px);transform:translateY(10px) scale(.98)}to{opacity:1;filter:none;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   Today's 3 / morning / review / print
   ============================================================ */
.picks{position:relative;margin:0 0 20px;padding:14px 16px 8px;border-radius:20px;animation:clearIn .6s cubic-bezier(.2,.8,.2,1)}
.picks.slim{padding:12px 14px}
.picks-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.picks-head .ic{color:var(--accent)}
.picks-head b{font-size:14.5px;letter-spacing:.04em}
.picks-head .ph-sub{font-size:12px;color:var(--ink-3)}
.picks-head .ph-tools{margin-left:auto;display:flex;gap:6px}
.picks.all-done .picks-head b{color:var(--green)}
.pick-row{display:grid;grid-template-columns:24px 26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line-2)}
.pick-row:first-of-type{border-top:0}
.pick-no{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-grad);color:#fff;flex:none}
.pick-row.done .pick-no{background:var(--green)}
.pick-row .check{margin-top:0}
.pick-row.done .check{background:var(--green);border-color:var(--green);color:#fff}
.pick-row.done .p-title{color:var(--ink-3);text-decoration:line-through}
.p-title{min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-why{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.picks-empty{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-2)}
.picks-empty .ic{color:var(--accent)}
.picks-empty .btn{margin-left:auto}
.side-actions{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.banner .b-ic.calm{background:var(--accent-soft);color:var(--accent)}

.mg-why{margin:12px auto 0;max-width:560px;font-size:13.5px;color:var(--ink-2)}
.mg-why b{color:var(--ink)}
.mg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:30px}
.mg-actions .btn{height:44px;padding:0 16px;border-radius:14px;font-size:14px}
.mg-actions kbd{margin-left:4px}
.mg-actions .btn.primary kbd{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.mg-list{margin:22px auto 0;max-width:580px;text-align:left;display:flex;flex-direction:column;gap:8px}
.mg-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);animation:clearIn .5s cubic-bezier(.2,.8,.2,1)}
.mg-item .pick-no{width:28px;height:28px;font-size:13px}
.mg-item .t{font-size:15px;font-weight:700;line-height:1.5}
.mg-item .w{font-size:12px;color:var(--ink-3)}
.mg-more{margin:16px auto 0;max-width:600px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.mg-more .lbl{font-size:12px;color:var(--ink-3)}
.mg-more button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px dashed var(--line);background:var(--glass);font-size:12.5px;color:var(--ink-2)}
.mg-more button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}

.rv-stat{display:flex;gap:10px;margin:4px 0 8px}
.rv-stat div{flex:1;padding:12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line-2);text-align:center}
.rv-stat b{display:block;font-size:24px;line-height:1.2}
.rv-stat span{font-size:12px;color:var(--ink-3)}
.rv-sec{padding:12px 0 4px;border-top:1px solid var(--line-2)}
.rv-sec h4{margin:0 0 6px;font-size:13.5px}
.rv-list{margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-2);max-height:180px;overflow:auto}
.rv-list li{padding:2px 0}
.rv-list li::before{content:"・"}

#print{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important}
  body > *:not(#print){display:none!important}
  #print{display:block;font:10.5pt/1.65 var(--font);color:#000}
  #print h1{font-size:15pt;margin:0}
  #print .pr-date{font-size:9.5pt;color:#444;margin:2pt 0 10pt}
  #print h2{font-size:11pt;margin:12pt 0 4pt;padding-bottom:2pt;border-bottom:1.2px solid #555}
  #print ul{list-style:none;margin:0;padding:0}
  #print li{display:flex;gap:8pt;padding:3.5pt 0;border-bottom:1px dotted #bbb;break-inside:avoid}
  #print li .bx{width:10pt;height:10pt;border:1px solid #000;flex:none;margin-top:3pt}
  #print li .meta{margin-left:auto;color:#444;font-size:9pt;white-space:nowrap;padding-left:8pt}
  #print .memo{margin-top:14pt;height:110pt;border:1px solid #999;border-radius:4pt;padding:4pt 6pt;font-size:9pt;color:#666}
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;border-width:0 0 1px 0;overflow-x:auto}
  .brand{padding:0 6px 0 0}

<script>
(function(){
'use strict';

/* ============================================================
   Storage
   ============================================================ */
var STORE_KEY = 'sakutto.tasks.v1';
var PREF_KEY  = 'sakutto.prefs.v1';
var storageOK = true;

function load(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ storageOK = false; return fallback; }
}
function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state.tasks));
    localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs));
    storageOK = true;
  }catch(e){ storageOK = false; }
}

var DEFAULT_PREFS = {
  view:'all', groupBy:'due', collapsed:{}, theme:'auto', lite:false,
  autoSub:true, rules:null, lastBackup:null, bannerDismissed:null,
  picks:null, morningAuto:true, lastMorning:null, lastReview:null, learn:{},
};
var state = {
  tasks: load(STORE_KEY, []),
  prefs: Object.assign({}, DEFAULT_PREFS, load(PREF_KEY, {})),
};
if(!Array.isArray(state.tasks)) state.tasks = [];
var justAdded = {};
var openNotes = {};
var editing = false;
var undoStack = null;
var insight = null;

/* ============================================================
   Date helpers
   ============================================================ */
var WDJ = ['日','月','火','水','木','金','土'];
var WD = {'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};

function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function diffDays(a, b){ return Math.round((b - a) / 86400000); }
function mondayOf(d){ return addDays(d, -((d.getDay() + 6) % 7)); }
function endOfWeek(d){ return addDays(mondayOf(d), 6); }
function nextWeekday(base, wd, includeToday){
  var diff = (wd - base.getDay() + 7) % 7;
  if(diff === 0 && !includeToday) diff = 7;
  return addDays(base, diff);
}
function clampDay(y, m, day){ var last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(day, last)); }
function todayStr(){ return ymd(today()); }
function fmtMD(s){ var d = parseYmd(s); return (d.getMonth()+1) + '/' + d.getDate() + '(' + WDJ[d.getDay()] + ')'; }
function dayKey(ts){ return ymd(new Date(ts)); }
function hm(ts){ var d = new Date(ts); return d.getHours() + ':' + pad(d.getMinutes()); }

function dueInfo(due){
  var n = diffDays(today(), parseYmd(due));
  if(n < 0)  return { text: (-n) + '日超過', cls:'over', title: fmtMD(due) + ' が期限でした' };
  if(n === 0) return { text:'今日', cls:'today', title: fmtMD(due) };
  if(n === 1) return { text:'明日', cls:'', title: fmtMD(due) };
  if(n === 2) return { text:'明後日', cls:'', title: fmtMD(due) };
  return { text: fmtMD(due), cls:'', title: n + '日後' };
}

/* ============================================================
   Natural-language parser (Japanese)
   ============================================================ */
function toHalf(s){
  return s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
          .replace(/／/g, '/');
}

var DATE_RULES = [
  [/(\d{1,2})\s*\/\s*(\d{1,2})|(\d{1,2})月(\d{1,2})日?/, function(m, t){
    var mo = +(m[1] || m[3]) - 1, d = +(m[2] || m[4]);
    if(mo < 0 || mo > 11 || d < 1 || d > 31) return null;
    var x = new Date(t.getFullYear(), mo, d);
    if(x.getMonth() !== mo) return null;
    if(diffDays(t, x) < -60) x = new Date(t.getFullYear() + 1, mo, d);
    return x;
  }],
  [/明後日|あさって/, function(m, t){ return addDays(t, 2); }],
  [/明日|あした/, function(m, t){ return addDays(t, 1); }],
  [/今日中|今日|きょう|本日中|本日/, function(m, t){ return t; }],
  [/(\d{1,2})日後/, function(m, t){ return addDays(t, +m[1]); }],
  [/再来週/, function(m, t){ return addDays(mondayOf(t), 14); }],
  [/来週の?([月火水木金土日])曜?日?/, function(m, t){ return addDays(mondayOf(t), 7 + (WD[m[1]] + 6) % 7); }],
  [/来週/, function(m, t){ return addDays(mondayOf(t), 7); }],
  [/今週中|今週|週内|週末/, function(m, t){ var fri = addDays(mondayOf(t), 4); return fri < t ? t : fri; }],
  [/来月末/, function(m, t){ return new Date(t.getFullYear(), t.getMonth() + 2, 0); }],
  [/今月末|月末/, function(m, t){ return new Date(t.getFullYear(), t.getMonth() + 1, 0); }],
  [/来月(\d{1,2})日/, function(m, t){ return clampDay(t.getFullYear(), t.getMonth() + 1, +m[1]); }],
  [/来月/, function(m, t){ return new Date(t.getFullYear(), t.getMonth() + 1, 1); }],
  [/([月火水木金土日])曜日?/, function(m, t){ return nextWeekday(t, WD[m[1]], true); }],
  [/(?:^|[^\d月\/])(\d{1,2})日(?![間後前分目付])/, function(m, t){
    var d = +m[1]; if(d < 1 || d > 31) return null;
    var x = clampDay(t.getFullYear(), t.getMonth(), d);
    if(x < t) x = clampDay(t.getFullYear(), t.getMonth() + 1, d);
    return x;
  }, true],
];

var RECUR_RULES = [
  [/毎年度?(\d{1,2})月(\d{1,2})日/, function(m){ return { type:'yearly', m: Math.min(11, Math.max(0, +m[1] - 1)), d: Math.min(31, Math.max(1, +m[2])) }; }],
  [/毎年度?(\d{1,2})月/, function(m){ return { type:'yearly', m: Math.min(11, Math.max(0, +m[1] - 1)), d: 1 }; }],
  [/毎週の?([月火水木金土日])曜?日?/, function(m){ return { type:'weekly', wd: WD[m[1]] }; }],
  [/毎週/, function(m, t){ return { type:'weekly', wd: t.getDay() }; }],
  [/毎月末/, function(){ return { type:'monthly', day:'end' }; }],
  [/毎月(\d{1,2})日/, function(m){ return { type:'monthly', day: Math.min(31, Math.max(1, +m[1])) }; }],
  [/毎月/, function(m, t){ return { type:'monthly', day: t.getDate() }; }],
  [/平日毎日|毎平日|平日は毎日/, function(){ return { type:'weekdays' }; }],
  [/毎日/, function(){ return { type:'daily' }; }],
];

function firstOccurrence(r, from){
  if(r.type === 'daily') return from;
  if(r.type === 'weekdays'){ var d = from; while(d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); return d; }
  if(r.type === 'weekly') return nextWeekday(from, r.wd, true);
  if(r.type === 'yearly'){
    var yc = clampDay(from.getFullYear(), r.m, r.d);
    return yc < from ? clampDay(from.getFullYear() + 1, r.m, r.d) : yc;
  }
  if(r.type === 'monthly'){
    var y = from.getFullYear(), m = from.getMonth();
    var c = r.day === 'end' ? new Date(y, m + 1, 0) : clampDay(y, m, r.day);
    if(c < from) c = r.day === 'end' ? new Date(y, m + 2, 0) : clampDay(y, m + 1, r.day);
    return c;
  }
  return from;
}
function nextOccurrence(r, base){ return firstOccurrence(r, addDays(base, 1)); }
function recurLabel(r){
  if(!r) return '';
  if(r.type === 'daily') return '毎日';
  if(r.type === 'weekdays') return '平日毎日';
  if(r.type === 'weekly') return '毎週' + WDJ[r.wd] + '曜';
  if(r.type === 'monthly') return r.day === 'end' ? '毎月末' : '毎月' + r.day + '日';
  if(r.type === 'yearly') return '毎年' + (r.m + 1) + '月' + r.d + '日';
  return '';
}

// Remove a matched token from the title unless it reads as part of a phrase (e.g. 「明日の会議」).
function stripToken(s, idx, len){
  var after = s.slice(idx + len);
  if(/^(の|締|〆|開催|実施|予定|分)/.test(after)) return s;
  var suffix = after.match(/^(までに|まで|中に|中|頃|ごろ|に|は)?[\s　、,]*/);
  var before = s.slice(0, idx).replace(/[\s　、,]*$/, '');
  var rest = after.slice(suffix[0].length);
  return before && rest ? before + ' ' + rest : before + rest;
}

function parse(raw){
  var t = today();
  var s = raw.trim();
  var out = { urgent:false, someday:false, waiting:false, person:'', recur:null, due:null, title:'' };

  if(/[!！]/.test(s)){ out.urgent = true; s = s.replace(/[!！]+/g, ' '); }
  if(/至急|緊急|急ぎ/.test(s)) out.urgent = true;

  s = s.replace(/[@＠]([^\s　@＠、,]+)/, function(_, p){ out.person = p; return ' '; });
  if(/待ち(?!合)/.test(s)) out.waiting = true;

  s = s.replace(/^いつか(やる)?(?:[\s　、]+|$)|[\s　]+いつか(やる)?$/, function(){ out.someday = true; return ' '; });

  var i, m;
  for(i = 0; i < RECUR_RULES.length; i++){
    m = toHalf(s).match(RECUR_RULES[i][0]);
    if(m){ out.recur = RECUR_RULES[i][1](m, t); s = stripToken(s, m.index, m[0].length); break; }
  }
  for(i = 0; i < DATE_RULES.length; i++){
    m = toHalf(s).match(DATE_RULES[i][0]);
    if(!m) continue;
    var d = DATE_RULES[i][1](m, t);
    if(!d) continue;
    var idx = m.index, len = m[0].length;
    if(DATE_RULES[i][2]){
      var lead = m[0].length - m[0].replace(/^[^\d]/, '').length;
      idx += lead; len -= lead;
    }
    out.due = ymd(d);
    s = stripToken(s, idx, len);
    break;
  }
  if(out.recur && !out.due) out.due = ymd(firstOccurrence(out.recur, t));
  if(out.due) out.someday = false;

  var title = s.replace(/[\s　]+/g, ' ').replace(/^[\s、,。・:：]+|[\s、,:：]+$/g, '').trim();
  if(!title) title = raw.replace(/[!！]+/g, '').trim() || raw.trim();
  out.title = title;
  return out;
}

function splitLines(raw){
  return raw.split(/\r?\n/)
    .map(function(l){ return l.replace(/^\s*(?:[・\-\*•□■◯○●☐✓✔︎]|\d+[\.\)．）]|[①-⑳]|\(\d+\)|（\d+）)\s*/, '').trim(); })
    .filter(Boolean);
}

/* ============================================================
   Analysis — categories, topics, clusters, similar, templates
   (rule-based, runs fully offline)
   ============================================================ */
var CATS = [
  { k:'kaikaku',  name:'業務改革・DX',   h:300, kw:['業務改革','改革','BPR','DX','RPA','AI','OCR','デジタル','電子申請','オンライン','ペーパーレス','業務量','棚卸','業務フロー','効率化','業務改善','改善','システム','ツール','行革','kintone','キントーン','ノーコード','ローコード','チャットボット','電子決裁','テレワーク','書かない窓口','ヒアリング'] },
  { k:'gikai',    name:'議会',           h:350, kw:['議会','一般質問','答弁','想定問答','議員','議案','本会議','常任委員会'] },
  { k:'keiyaku',  name:'契約・発注',     h:24,  kw:['契約','発注','委託','入札','仕様書','購入','納品','検収','業者'] },
  { k:'yosan',    name:'予算・経理',     h:40,  kw:['予算','見積','決算','支払','精算','請求','旅費','経費','執行','補正','会計','歳出','歳入','補助金'] },
  { k:'shokai',   name:'照会・調査',     h:268, kw:['照会','回答','調査','アンケート','統計','実績報告','報告'] },
  { k:'bunsho',   name:'文書・決裁',     h:216, kw:['起案','決裁','通知','文書','公文','施行','供覧','回覧','押印','要綱','規則','条例','申請'] },
  { k:'koho',     name:'広報・周知',     h:188, kw:['広報','ホームページ','HP','チラシ','ポスター','周知','掲載','SNS','記事','原稿','プレス','お知らせ'] },
  { k:'event',    name:'イベント・行事', h:148, kw:['説明会','イベント','行事','式典','訓練','講座','祭','大会','視察','催し','セミナー'] },
  { k:'kaigi',    name:'会議・打合せ',   h:232, kw:['会議','打ち合わせ','打合せ','協議','ミーティング','MTG','委員会','審議会','定例','議事録'] },
  { k:'madoguchi',name:'窓口・市民対応', h:328, kw:['窓口','市民','住民','苦情','要望','来庁','問い合わせ','問合せ','相談'] },
  { k:'renraku',  name:'連絡・調整',     h:200, kw:['電話','メール','連絡','返信','調整','依頼','共有','確認'] },
  { k:'shomu',    name:'庶務・人事',     h:96,  kw:['研修','出張','休暇','勤務','人事','異動','引き継ぎ','引継','名刺','備品','消耗品','庶務','当番','会議室'] },
  { k:'shiryo',   name:'資料作成',       h:172, kw:['資料','作成','まとめ','集計','データ','エクセル','Excel','グラフ','名簿','マニュアル'] },
];
var CAT_OTHER = { k:'other', name:'その他', h:220, kw:[] };
var CAT_BY_KEY = {};
CATS.forEach(function(c){ CAT_BY_KEY[c.k] = c; });
CAT_BY_KEY.other = CAT_OTHER;

// Corrections the user made are remembered per word and take priority over the keyword table.
function categorizeInfo(title){
  var s = toHalf(title), learn = state.prefs.learn || {}, hit = '';
  Object.keys(learn).forEach(function(term){
    if(s.indexOf(term) >= 0 && term.length > hit.length && CAT_BY_KEY[learn[term]]) hit = term;
  });
  if(hit) return { cat: CAT_BY_KEY[learn[hit]], learned: hit };
  var best = CAT_OTHER, bestScore = 0;
  CATS.forEach(function(c, i){
    var score = 0;
    c.kw.forEach(function(k){ if(s.indexOf(k) >= 0) score += 10; });
    score -= i * 0.01;
    if(score > bestScore){ bestScore = score; best = c; }
  });
  return { cat: best, learned: '' };
}
function categorize(title){ return categorizeInfo(title).cat; }
function learnCat(title, k){
  if(!state.prefs.learn) state.prefs.learn = {};
  topics(title).forEach(function(term){ state.prefs.learn[term] = k; });
}
function forgetCat(title){
  var learn = state.prefs.learn || {};
  topics(title).forEach(function(term){ delete learn[term]; });
}
function categoryOf(t){ return (t.cat && CAT_BY_KEY[t.cat]) || categorize(t.title); }

var TOPIC_RE = /[一-龠々〆ヵヶァ-ヴーA-Za-z0-9]{2,}/g;
var ACTION_SUFFIX = /(作成|確認|準備|予約|連絡|返信|対応|チェック|調整|提出|送付|送信|依頼|相談|検討|整理|修正|印刷|共有|集計|発注|申込|申請|手配|回答|報告|確定|決定|入力|処理|開催|実施|参加|出席|設定|登録|起案|決裁|精算|購入|配布|掲載|作り|まとめ|(?<!提)案)$/;
var STOP = {};
('資料 書類 今日 明日 課内 庁内 当日 前日 日程 会場 備品 名簿 結果 メモ 内容 担当 関係 関係課 業務 作業 対応 確認 作成 準備 連絡 '
 + '電話 メール 件 案 分 用 等 一式 全体 今回 次回 来週 今週 午前 午後 予定 期限 締切 提出 回答 報告 共有 依頼 修正 データ '
 + '会議 打合 打合せ 説明 課長 部長 係長 担当者 自分 市民 住民 決裁 起案 送付 返信 調整 年度 次年度 今年度 来年度 前年度 本年度').split(' ').forEach(function(w){ STOP[w] = 1; });

function topicsRaw(title){
  var segs = toHalf(title).match(TOPIC_RE) || [];
  var out = [];
  segs.forEach(function(s){
    var prev;
    do{ prev = s; s = s.replace(ACTION_SUFFIX, ''); }while(s !== prev && s.length > 1);
    s = s.replace(/^\d+(月|年|日)?/, '');
    if(/^(令和|平成|R)\d*年?度?$/.test(s)) return;
    if(s.length >= 2 && !/^\d+$/.test(s)) out.push(s);
  });
  return out;
}
function topics(title){ return topicsRaw(title).filter(function(s){ return !STOP[s]; }); }
function termsRelated(a, b){
  if(a === b) return true;
  var s = a.length <= b.length ? a : b, l = s === a ? b : a;
  if(s.length >= 3) return l.indexOf(s) >= 0;

}

// Group related tasks: shared topic words (incl. departments / counterparts) and parent–child links.
function clusterTasks(tasks){
  var n = tasks.length, par = [], idx = {};
  for(var i = 0; i < n; i++){ par[i] = i; idx[tasks[i].id] = i; }
  function find(i){ while(par[i] !== i){ par[i] = par[par[i]]; i = par[i]; } return i; }
  function union(a, b){ a = find(a); b = find(b); if(a !== b) par[b] = a; }

  // Children link only through their parent, so shared template words never chain projects together.
  var tops = tasks.map(function(t){
    if(t.parentId && idx[t.parentId] != null) return [];
    var ts = topics(t.title);
    if(t.person) ts.push(t.person.replace(/(さん|様|殿)$/, ''));
    return ts;
  });
  var termMap = {};
  tops.forEach(function(ts, i){ ts.forEach(function(term){ (termMap[term] = termMap[term] || []).push(i); }); });
  var terms = Object.keys(termMap).filter(function(term){ return !(n >= 8 && termMap[term].length > n * 0.45); });
  terms.forEach(function(term){ var l = termMap[term]; for(var k = 1; k < l.length; k++) union(l[0], l[k]); });
  for(var a = 0; a < terms.length; a++){
    for(var b = a + 1; b < terms.length; b++){
      if(termsRelated(terms[a], terms[b])) union(termMap[terms[a]][0], termMap[terms[b]][0]);
    }
  }
  tasks.forEach(function(t, i){ if(t.parentId && idx[t.parentId] != null) union(idx[t.parentId], i); });

  var groups = {};
  tasks.forEach(function(t, i){ var r = find(i); (groups[r] = groups[r] || []).push(i); });
  var clusters = [], singles = [];
  Object.keys(groups).forEach(function(r){
    var members = groups[r];
    if(members.length < 2){ singles.push(tasks[members[0]]); return; }
    // Label = the word shared (exactly or as a prefix/part) by the most members; shorter wins ties.
    var cand = {};
    members.forEach(function(i){ tops[i].forEach(function(term){ cand[term] = 1; }); });
    var label = '', best = 0;
    Object.keys(cand).forEach(function(term){
      var cover = members.filter(function(i){ return tops[i].some(function(x){ return termsRelated(term, x); }); }).length;
      var sc = cover * 100 - term.length;
      if(cover >= 2 && sc > best){ best = sc; label = term; }
    });
    if(!label){
      var p = members.map(function(i){ return tasks[i]; }).filter(function(t){ return !t.parentId; })[0] || tasks[members[0]];
      label = parentLabel(p);
    }
    clusters.push({ label: label, tasks: members.map(function(i){ return tasks[i]; }) });
  });
  return { clusters: clusters, singles: singles };
}

function normForSim(s){ return toHalf(s).replace(/[\s　、。・,.!！?？「」『』（）()【】\[\]:：]/g, '').toLowerCase(); }
// Bigram overlap; also compared with particles (hiragana) removed so 「財政課に…の確認」≒「財政課へ…を確認」.
function similarity(a, b){
  a = normForSim(a); b = normForSim(b);
  var ak = a.replace(/[ぁ-ゖ]/g, ''), bk = b.replace(/[ぁ-ゖ]/g, '');
  var s1 = dice(a, b);
  return ak.length >= 3 && bk.length >= 3 ? Math.max(s1, dice(ak, bk)) : s1;
}
function dice(a, b){
  if(a === b) return 1;
  if(a.length < 3 || b.length < 3) return 0;
  var m = {}, i, hit = 0;
  for(i = 0; i < a.length - 1; i++){ var g = a.substr(i, 2); m[g] = (m[g] || 0) + 1; }
  for(i = 0; i < b.length - 1; i++){ var h = b.substr(i, 2); if(m[h]){ m[h]--; hit++; } }
  return 2 * hit / (a.length - 1 + b.length - 1);
}
function findSimilar(t, excludeIds){
  var best = null, bestScore = 0;
  state.tasks.forEach(function(x){
    if(x.id === t.id || x.status === 'done' || (excludeIds && excludeIds[x.id])) return;
    var sc = similarity(t.title, x.title);
    if(sc > bestScore){ bestScore = sc; best = x; }
  });
  return bestScore >= 0.72 ? best : null;
}

function parseRules(text){
  var rules = [];
  (text || '').split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line || line.charAt(0) === '#' || line.charAt(0) === '＃') return;
    var m = line.match(/^(.+?)\s*[:：]\s*(.+)$/);
    if(!m) return;
    var keys = m[1].split(/[|｜]/).map(function(k){ return k.trim(); }).filter(Boolean);
    var items = m[2].split(/[,，、](?![^()（）]*[)）])/).map(function(it){
      it = it.trim(); if(!it) return null;
      var om = toHalf(it).match(/[(（]\s*([+\-＋－−]?\d+)\s*日?\s*[)）]\s*$/);
      var offset = null, title = it;
      if(om){
        offset = parseInt(om[1].replace(/[－−]/, '-').replace('＋', '+'), 10);
        title = it.slice(0, om.index).trim();
      }
      return title ? { title: title, offset: offset } : null;
    }).filter(Boolean);
    if(keys.length && items.length) rules.push({ keys: keys, items: items, name: keys[0] });
  });
  return rules;
}
var rulesCache = { text:null, rules:[] };
function getRules(){
  var text = state.prefs.rules == null ? DEFAULT_RULES : state.prefs.rules;
  if(rulesCache.text !== text) rulesCache = { text: text, rules: parseRules(text) };
  return rulesCache.rules;
}

function matchRule(title, force){
  var s = toHalf(title), rules = getRules();
  for(var i = 0; i < rules.length; i++){
    var r = rules[i];
    if(!r.keys.some(function(k){ return s.indexOf(toHalf(k)) >= 0; })) continue;
    if(!force){
      if(STEP_RE.test(s)) return null;
      // Ignore the words that triggered the rule itself (e.g. 出張 vs 出張伺い).
      var tt = topicsRaw(title).filter(function(y){
        return !r.keys.some(function(k){ k = toHalf(k); return y.indexOf(k) >= 0 || termsRelated(y, k); });
      });
      var overlap = r.items.some(function(it){
        return topicsRaw(it.title).some(function(x){ return tt.some(function(y){ return termsRelated(x, y); }); });
      });
      if(overlap) return null;
    }
    return r;
  }
  return null;
}

function esc(s){

function short(s, n){ n = n || 18; return s.length > n ? s.slice(0, n) + '…' : s; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function catChip(c, asButton, extra){

  return asButton
    ? '<button class="cat" style="--h:' + c.h + '" data-act="cat" title="カテゴリを変更">' + inner + '</button>'
    : '<span class="cat" style="--h:' + c.h + '">' + inner + '</span>';
}

  focusBtn: $('#focusBtn'), importFile: $('#importFile'),
  picks: $('#picks'), morning: $('#morning'), print: $('#print'), morningBtn: $('#morningBtn'), reviewBtn: $('#reviewBtn'),
};

el.helpBtn.innerHTML = icon('help');

el.reviewBtn.innerHTML = icon('moon') + '<span class="label">ふり返り</span>';

/* ============================================================
   Mutations
   ============================================================ */
function commit(){ persist(); render(); }
function mutate(fn, msg, opts){
  var snap = JSON.stringify(state.tasks);
  fn();
  persist();
  render();
  if(msg){
    undoStack = snap;
    toast(msg, Object.assign({ action:'元に戻す', onAction: undo }, opts || {}));
  }
}
function undo(){
  if(!undoStack) return;
  state.tasks = JSON.parse(undoStack);
  undoStack = null;
  insight = null;
  commit();
  toast('元に戻しました');
}

function makeTask(p, view){
  var due = p.due, someday = p.someday, status = p.waiting ? 'waiting' : 'open';
  if(view === 'today' && !due && !someday && status === 'open') due = todayStr();
  if(view === 'someday' && !due) someday = true;
  if(view === 'waiting') status = 'waiting';
  return {
    id: uid(), title: p.title, note: '', due: due || null, status: status, someday: !!someday,
    urgent: !!p.urgent, person: p.person || '', waitingSince: status === 'waiting' ? todayStr() : null,
    recur: p.recur || null, createdAt: Date.now() + Math.random(), doneAt: null,
    cat: null, parentId: null, offset: null, dueManual: false,
  };
}
function makeChild(parent, item, order){
  return {
    id: uid(), title: item.title, note: '', due: childDue(parent, item.offset), status: 'open', someday: false,
    urgent: false, person: '', waitingSince: null, recur: null,
    createdAt: Date.now() + (order || 0) * 0.01 + Math.random() * 0.001,
    doneAt: null, cat: categoryOf(parent).k, parentId: parent.id, offset: item.offset, dueManual: false,
  };
}

function analyse(t, batch){
  var rep = { id: t.id, subs: [], dupId: null, rule: null };
  var dup = findSimilar(t, batch);
  if(dup) rep.dupId = dup.id;
  var rule = (t.status === 'open' && !t.someday && !t.recur) ? matchRule(t.title, false) : null;
  if(rule){
    rep.rule = rule.name;
    rule.items.forEach(function(it, i){
      var entry = { title: it.title, offset: it.offset, childId: null };
      if(state.prefs.autoSub){
        var c = makeChild(t, it, i);
        state.tasks.push(c); justAdded[c.id] = 1; entry.childId = c.id;
      }
      rep.subs.push(entry);
    });
  }
  return rep;
}

function addFromInput(){
  var raw = el.input.value;
  var lines = splitLines(raw);
  if(!lines.length) return;
  var view = state.prefs.view === 'done' ? 'all' : state.prefs.view;
  var snap = JSON.stringify(state.tasks);
  var fromMail = mailMode && looksLikeMail(raw);
  var parsed = fromMail ? [extractMail(raw)] : lines.map(parse);
  var added = parsed.map(function(p){ var t = makeTask(p, view); if(p.note) t.note = p.note; return t; });
  var batch = {};
  added.forEach(function(t){ state.tasks.push(t); justAdded[t.id] = 1; batch[t.id] = 1; });
  var reports = added.map(function(t){ var r = analyse(t, batch); r.fromMail = fromMail; return r; });

  mailMode = true;
  el.input.value = '';
  autosize();
  if(state.prefs.view === 'done') state.prefs.view = 'all';
  persist();
  undoStack = snap;
  insight = { reports: reports };
  render();

  var subsAdded = reports.reduce(function(n, r){ return n + r.subs.filter(function(s){ return s.childId; }).length; }, 0);
  if(added.length > 1){
    toast(added.length + '件を書き出しました' + (subsAdded ? '（付属作業 ' + subsAdded + '件も追加）' : ''), { action:'元に戻す', onAction: undo });
  }else if(subsAdded){
    toast('付属作業を ' + subsAdded + '件 追加しました', { action:'元に戻す', onAction: undo });
  }else{
    var t = added[0];
    if(!inView(t, state.prefs.view)){
      var dest = destView(t);
      toast('「' + short(t.title) + '」を' + VIEWS[dest].label + 'に追加', { action:'見る', onAction: function(){ setView(dest); flashRow(t.id); } });
    }
  }
  var card = el.insight.firstElementChild;
  if(card){
    var rc = card.getBoundingClientRect();
    if(rc.top < 0 || rc.top > innerHeight - 120) card.scrollIntoView({ block:'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }
}
function destView(t){
  if(t.status === 'waiting') return 'waiting';
  if(t.someday) return 'someday';
  if(t.status === 'done') return 'done';
  return 'all';
}

function completeTask(id){
  var t = byId(id); if(!t) return null;
  var next = null;
  t.status = 'done';
  t.doneAt = Date.now();
  if(t.recur){
    var base = today();
    if(t.due && parseYmd(t.due) > base) base = parseYmd(t.due);
    next = Object.assign({}, t, {
      id: uid(), status:'open', doneAt:null, createdAt: Date.now(),
      due: ymd(nextOccurrence(t.recur, base)), waitingSince:null,
    });
    state.tasks.push(next);
    t.recur = null;
  }
  return next;
}

function toggleDone(id, row){
  var t = byId(id); if(!t) return;
  if(t.status === 'done'){
    mutate(function(){ t.status = 'open'; t.doneAt = null; }, '「' + short(t.title) + '」を未完了に戻しました');
    return;
  }
  if(row && row.classList.contains('completing')) return;
  var finish = function(){
    var hadToday = todayTasks().length;
    var snap = JSON.stringify(state.tasks);
    var next = completeTask(id);
    persist(); render();
    undoStack = snap;
    var remain = todayTasks().length;
    var siblings = t.parentId ? childrenOf(t.parentId) : [];
    var pk = todaysPicks();
    if(pk && pk.length && pk.some(function(x){ return x.id === id; }) && pk.every(function(x){ return x.status === 'done'; })){
      sunburst();
      toast('今日の' + pk.length + 'つ、達成です！ 空がだいぶ晴れました', { action:'元に戻す', onAction: undo });
    }else if(hadToday > 0 && remain === 0 && doneToday().length > 0){
      sunburst();
      toast('今日の分はすべて完了。モヤが晴れました', { action:'元に戻す', onAction: undo });
    }else if(next){
      toast('完了。次回は ' + fmtMD(next.due) + ' に追加しました', { action:'元に戻す', onAction: undo });
    }else if(siblings.length && siblings.every(function(x){ return x.status === 'done'; })){
      var p = byId(t.parentId);
      toast('「' + (p ? parentLabel(p) : '') + '」の付属作業がすべて完了！', { action:'元に戻す', onAction: undo });
    }else{
      toast('「' + short(t.title) + '」完了', { action:'元に戻す', onAction: undo });
    }
  };
  if(!row || reducedMotion()){ finish(); return; }
  row.classList.add('completing');
  setTimeout(function(){
    row.style.maxHeight = row.offsetHeight + 'px';
    row.offsetHeight; // reflow
    row.classList.add('leaving');
    row.style.maxHeight = '0px';
    setTimeout(finish, 430);
  }, 380);
}

// Shift accompanying work when the parent's deadline changes.
function reflowChildren(parent){
  var n = 0;
  childrenOf(parent.id).forEach(function(c){
    if(c.status === 'done' || c.dueManual || c.offset == null) return;
    var d = childDue(parent, c.offset);
    if(d !== c.due){ c.due = d; n++; }
  });
  return n;
}

function setDue(id, d, label){
  var t = byId(id); if(!t) return;
  var moved = 0;
  mutate(function(){
    t.due = d ? ymd(d) : null;
    t.someday = false;
    if(t.parentId) t.dueManual = true;
    moved = reflowChildren(t);
  }, (d ? '「' + short(t.title) + '」を' + (label || fmtMD(ymd(d))) + 'に' : '「' + short(t.title) + '」の日付を外しました')
     + (moved ? '（付属作業 ' + moved + '件の期限も逆算）' : ''));
}
function toggleUrgent(id){ var t = byId(id); if(!t) return; mutate(function(){ t.urgent = !t.urgent; }); }
function setWaiting(id, person){
  var t = byId(id); if(!t) return;
  mutate(function(){ t.status = 'waiting'; t.someday = false; t.person = person; t.waitingSince = todayStr(); },
    '「' + short(t.title) + '」を待ちに移動');
}
function replyCame(id){
  var t = byId(id); if(!t) return;
  mutate(function(){ t.status = 'open'; t.waitingSince = null; t.due = todayStr(); }, '返事が来たので今日のタスクに戻しました');
}
function nudged(id){
  var t = byId(id); if(!t) return;
  mutate(function(){ t.waitingSince = todayStr(); }, '催促済み。経過日数をリセットしました');
}
function toSomeday(id){
  var t = byId(id); if(!t) return;
  var was = t.someday;
  mutate(function(){ t.someday = !t.someday; if(t.someday){ t.due = null; t.status = 'open'; } },
    was ? '「' + short(t.title) + '」をやることに戻しました' : '「' + short(t.title) + '」をいつかへ');
}
function removeTask(id){
  var t = byId(id); if(!t) return;
  var kids = childrenOf(id).filter(function(c){ return c.status !== 'done'; });
  mutate(function(){
    state.tasks = state.tasks.filter(function(x){ return x.id !== id && !(x.parentId === id && x.status !== 'done'); });
    state.tasks.forEach(function(x){ if(x.parentId === id) x.parentId = null; });
  }, '「' + short(t.title) + '」を削除しました' + (kids.length ? '（付属作業 ' + kids.length + '件も）' : ''));
}
function renameTask(id, title){
  var t = byId(id); if(!t) return;
  title = title.trim();
  if(title && title !== t.title) t.title = title;
  editing = false;
  commit();
}
function mergeInto(newId, oldId){
  var n = byId(newId), o = byId(oldId); if(!n || !o) return;
  mutate(function(){
    if(normForSim(n.title) !== normForSim(o.title)) o.note = (o.note ? o.note + '\n' : '') + '＋ ' + n.title;
    if(n.due && (!o.due || n.due < o.due)) o.due = n.due;
    if(n.urgent) o.urgent = true;
    state.tasks = state.tasks.filter(function(x){ return x.id !== newId && x.parentId !== newId; });
    insight = null;
  }, '「' + short(o.title) + '」に1つにまとめました');
  flashRow(oldId);
}
function addChildren(parent, items){
  items.forEach(function(it, i){ var c = makeChild(parent, it, i); state.tasks.push(c); justAdded[c.id] = 1; });
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  applyTheme();
  renderHeader();
  renderNav();
  renderInsight();
  renderPicks();
  renderBanner();
  if(!editing) renderView();
  renderBackupNote();
  justAdded = {};
}

function renderHeader(){
  var T = today();
  el.date.textContent = T.getFullYear() + '年（令和' + (T.getFullYear() - 2018) + '年）' + (T.getMonth()+1) + '月' + T.getDate() + '日（' + WDJ[T.getDay()] + '）';
  var h = new Date().getHours();
  el.greet.textContent = h < 10 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'お疲れさまです';

  var remain = todayTasks().length, over = overdueTasks().length, done = doneToday().length, wait = waitingTasks().length;
  var open = openTasks().length;
  var html;
  if(remain === 0 && done === 0) html = open ? '今日が期限のものはありません。気になることから片付けましょう。' : '頭の中にあることを、まず書き出してみましょう。';
  else if(remain === 0) html = '今日の分は<b>すべて完了</b>。モヤがすっかり晴れました。';
  else html = '<span class="nw">今日やることは あと<b class="num">' + remain + '件</b></span>' + (over ? '<span class="nw">（うち<span class="over">期限切れ ' + over + '件</span>）</span>' : '');
  if(wait) html += '<span class="nw" style="color:var(--ink-3)">　・　返事待ち ' + wait + '件</span>';
  el.sub.innerHTML = html;

  var total = remain + done, clear, label, note;
  if(total === 0){
    clear = open === 0 ? 1 : 0.55;
    label = open === 0 ? '快晴' : 'おだやか';
    note = open === 0 ? 'やることはありません' : '今日が期限のものはなし';
  }else{
    clear = (done / total) * (over ? 0.85 : 1);
    label = clear >= 1 ? '快晴' : clear >= 0.66 ? '晴れ間' : clear >= 0.33 ? 'うす曇り' : 'モヤ';
    note = '今日 ' + done + ' / ' + total + ' 完了';
  }
  var glyph = clear >= 1 ? 'sun' : clear >= 0.5 ? 'part' : clear >= 0.25 ? 'cloud' : 'fog';
  document.documentElement.style.setProperty('--clear', String(Math.max(0.04, Math.min(1, clear))));
  el.weather.innerHTML =
    '<div class="wx-ic">' + WX[glyph] + '</div>' +
    '<div><div class="wx-label">頭の中の空模様</div><div class="wx-state">' + label + '</div>' +
    '<div class="wx-bar"><i style="width:' + Math.round(clear * 100) + '%"></i></div>' +
    '<div class="wx-sub num">' + note + '</div></div>';
  el.weather.title = '晴れ度 ' + Math.round(clear * 100) + '%：今日のタスクを片付けるほど、空が晴れていきます';
}

function renderNav(){
  var counts = { all: openTasks().length, today: todayTasks().length, waiting: waitingTasks().length, someday: somedayTasks().length, done: doneToday().length };
  var over = overdueTasks().length;
  el.nav.innerHTML = VIEW_ORDER.map(function(v, i){
    var c = counts[v], cls = '';
    if(v === 'today' && over) cls = 'alert';
    else if(v === 'today' && c) cls = 'soft';
    var countTxt = v === 'done' ? (c ? '今日 ' + c : '') : (c || '');
    return '<button class="nav-item' + (state.prefs.view === v ? ' active' : '') + '" data-view="' + v + '" title="' + VIEWS[v].label + ' (' + (i+1) + ')">' +
      icon(VIEWS[v].icon) + '<span class="label">' + VIEWS[v].label + '</span><span class="count num ' + cls + '">' + countTxt + '</span></button>';
  }).join('');
}

function insightShell(head, rows){
  return '<div class="insight glass" role="region" aria-label="整理の結果">' +
    '<button class="icon-btn ins-close" data-ins="close" title="閉じる" aria-label="閉じる">' + icon('x') + '</button>' +
    '<div class="ins-head"><span class="ins-ic">' + icon('sparkle') + '</span>' + head + '</div>' + rows.join('') + '</div>';
}
function insRow(k, v, block){ return '<div class="ins-row"><span class="ins-k">' + k + '</span><div class="ins-v"' + (block ? ' style="display:block"' : '') + '>' + v + '</div></div>'; }

function renderInsight(){
  if(!insight){ el.insight.innerHTML = ''; return; }
  var reps = insight.reports.filter(function(r){ return byId(r.id); });
  if(!reps.length){ insight = null; el.insight.innerHTML = ''; return; }
  var rows = [];
  var related = clusterTasks(openTasks().concat(waitingTasks())).clusters;

  if(reps.length === 1){
    var r = reps[0], t = byId(r.id);
    var ci = categorizeInfo(t.title);
    rows.push(insRow('分類', catChip(categoryOf(t)) + '<button class="linkbtn" data-ins="cat" data-id="' + t.id + '">変更</button>' +
      (!t.cat && ci.learned ? '<span class="ins-note" style="margin:0">「' + esc(ci.learned) + '」の過去の修正から学習</span>' : '')));
    if(r.fromMail){
      rows.push(insRow('メール', '件名から「<b>' + esc(short(t.title, 30)) + '</b>」' +
        (t.due ? '、期限 <b>' + fmtMD(t.due) + '</b>' : '（期限は見つかりませんでした）') +
        (t.person ? '、相手「<b>' + esc(t.person) + '</b>」' : '') + 'を読み取りました。本文はメモに保存しています。'));
    }
    var cl = related.filter(function(c){ return c.tasks.some(function(x){ return x.id === t.id; }); })[0];
    if(cl){
      var others = cl.tasks.filter(function(x){ return x.id !== t.id && x.parentId !== t.id; }).length;
      if(others > 0) rows.push(insRow('関連', '「<b>' + esc(cl.label) + '</b>」のタスク ' + others + '件 と同じまとまりにしました<button class="linkbtn" data-ins="rel">関連ごとに見る</button>'));
    }
    if(r.subs.length){
      var addedN = r.subs.filter(function(s){ return s.childId && byId(s.childId); }).length;
      var items = r.subs.map(function(s, i){
        var c = s.childId && byId(s.childId);
        var due = c ? c.due : childDue(t, s.offset);
        return '<label class="sub-item"><input type="checkbox" data-sub="' + i + '"' + (c ? ' checked' : '') + '>' +
          '<span class="sub-box">' + icon('check') + '</span><span class="sub-name">' + esc(s.title) + '</span>' +
          '<span class="sub-due num">' + (due ? fmtMD(due) : '') + '</span></label>';
      }).join('');
      rows.push(insRow('付属作業',
        '<div style="margin-bottom:4px">「' + esc(r.rule) + '」によくある作業' + (addedN ? 'を <b>' + addedN + '件</b> 追加しました' : 'です。必要なものにチェックしてください') + '</div>' +
        '<div class="ins-subs">' + items + '</div>' +
        '<div class="ins-note">' + (t.due ? '期限（' + fmtMD(t.due) + '）から逆算しています。' : '親タスクに期限を付けると、各作業の期限も自動で逆算されます。') +
        (addedN ? 'チェックを外すと取り消せます。' : '') + '</div>', true));
    }
    var d = r.dupId && byId(r.dupId);
    if(d && d.status !== 'done'){
      rows.push(insRow('重複かも', '似ているタスク「<b>' + esc(short(d.title, 26)) + '</b>」があります' +
        '<button class="btn sm" data-ins="merge" data-id="' + t.id + '" data-into="' + d.id + '">' + icon('merge') + '1つにまとめる</button>'));
    }
    el.insight.innerHTML = insightShell('<b>整理しました</b><span class="ins-title">「' + esc(t.title) + '」</span>', rows);
    return;
  }

  var catCount = {};
  reps.forEach(function(r){ var c = categoryOf(byId(r.id)); catCount[c.k] = (catCount[c.k] || 0) + 1; });
  rows.push(insRow('分類', Object.keys(catCount).sort(function(a, b){ return catCount[b] - catCount[a]; }).map(function(k){
    return catChip(CAT_BY_KEY[k], false, ' <b class="num">' + catCount[k] + '</b>');
  }).join('')));
  var withRule = reps.filter(function(r){ return r.subs.length; });
  if(withRule.length){
    var subN = withRule.reduce(function(n, r){ return n + r.subs.filter(function(s){ return s.childId && byId(s.childId); }).length; }, 0);
    rows.push(insRow('付属作業', withRule.map(function(r){ return '「<b>' + esc(short(byId(r.id).title, 14)) + '</b>」'; }).join('') +
      (subN ? 'に付属作業を <b>' + subN + '件</b> 追加しました' : 'に付属作業の候補があります（メニューの「付属作業…」から追加）')));
  }
  var dups = reps.filter(function(r){ var d = r.dupId && byId(r.dupId); return d && d.status !== 'done'; });
  if(dups.length){
    rows.push(insRow('重複かも', dups.map(function(r){
      var t = byId(r.id), d = byId(r.dupId);
      return '<span>「' + esc(short(t.title, 14)) + '」≒「' + esc(short(d.title, 14)) + '」</span><button class="btn sm" data-ins="merge" data-id="' + t.id + '" data-into="' + d.id + '">まとめる</button>';
    }).join('')));
  }
  var cls = related.filter(function(c){ return c.tasks.some(function(x){ return reps.some(function(r){ return r.id === x.id; }); }); });
  if(cls.length){
    rows.push(insRow('関連', cls.slice(0, 6).map(function(c){ return '<span class="chip">' + icon('link') + esc(c.label) + '・' + c.tasks.length + '件</span>'; }).join('') +
      '<button class="linkbtn" data-ins="rel">関連ごとに見る</button>'));
  }
  el.insight.innerHTML = insightShell('<b>' + reps.length + '件を書き出して整理しました</b>', rows);
}
