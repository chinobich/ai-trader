function collapseKey(key){
  var v = state.prefs.view;
  return v + ':' + (v === 'all' ? state.prefs.groupBy + ':' : '') + key;
}
function isCollapsed(key){
  var ck = collapseKey(key), c = state.prefs.collapsed;
  return Object.prototype.hasOwnProperty.call(c, ck) ? !!c[ck] : key === 'far';
}
function printBtn(){ return '<button class="btn" data-print title="今日のリストを印刷 (P)">' + icon('printer') + '印刷</button>'; }
function groupHtml(key, headInner, rowsHtml, extraCls, style){
  var collapsed = isCollapsed(key);
  return '<section class="group">' +
    '<button class="group-head ' + (extraCls || '') + (collapsed ? '' : ' open') + '" data-group="' + esc(key) + '" aria-expanded="' + !collapsed + '"' + (style ? ' style="' + style + '"' : '') + '>' +
    icon('chevron', 'chev') + headInner + '</button>' +
    (collapsed ? '' : '<div class="card glass"><ul class="tasks">' + rowsHtml + '</ul></div>') + '</section>';
}

function renderGrouped(tasks, groups){
  if(!tasks.length){ el.list.innerHTML = emptyState(state.prefs.view); return; }
  var buckets = {};
  tasks.forEach(function(t){ var g = groupOf(t); (buckets[g] = buckets[g] || []).push(t); });
  var T = today(), html = '';
  groups.forEach(function(g){
    var key = g[0], list = buckets[key];
    if(!list || !list.length) return;
    list.sort(cmp);
    var sub = '';
    if(key === 'today') sub = fmtMD(ymd(T));
    if(key === 'tomorrow') sub = fmtMD(ymd(addDays(T,1)));
    if(key === 'week') sub = '〜' + fmtMD(ymd(endOfWeek(T)));
    if(key === 'next') sub = fmtMD(ymd(addDays(endOfWeek(T),1))) + '〜';
    html += groupHtml(key, '<b>' + g[1] + '</b><span class="gcount num">' + list.length + '</span><span class="gsub num">' + sub + '</span>',
      list.map(function(t){ return taskRow(t, { group:key }); }).join(''), 'k-' + key);
  });
  el.list.innerHTML = html;
}

function renderByCategory(tasks){
  if(!tasks.length){ el.list.innerHTML = emptyState('all'); return; }
  var buckets = {};
  tasks.forEach(function(t){ var c = categoryOf(t); (buckets[c.k] = buckets[c.k] || []).push(t); });
  var keys = Object.keys(buckets).sort(function(a, b){
    if(a === 'other') return 1; if(b === 'other') return -1;
    return buckets[b].length - buckets[a].length;
  });
  el.list.innerHTML = keys.map(function(k){
    var c = CAT_BY_KEY[k], list = buckets[k].sort(cmp);
    return groupHtml(k, '<span class="gdot"></span><b>' + esc(c.name) + '</b><span class="gcount num">' + list.length + '</span>',
      list.map(function(t){ return taskRow(t, { mode:'cat' }); }).join(''), '', '--h:' + c.h);
  }).join('');
}

function orderWithChildren(list){
  var ids = {}; list.forEach(function(t){ ids[t.id] = 1; });
  var roots = list.filter(function(t){ return !t.parentId || !ids[t.parentId]; }).sort(cmp);
  var out = [];
  roots.forEach(function(r){
    out.push({ t:r, child:false });
    var kids = list.filter(function(c){ return c.parentId === r.id; }).sort(function(a, b){
      var ad = a.due || '9999', bd = b.due || '9999'; return ad !== bd ? (ad < bd ? -1 : 1) : a.createdAt - b.createdAt;
    });
    kids.forEach(function(c, i){ out.push({ t:c, child:true, last: i === kids.length - 1 }); });
  });
  return out;
}

function renderByRelation(tasks){
  if(!tasks.length){ el.list.innerHTML = emptyState('all'); return; }
  var res = clusterTasks(tasks);
  var firstDue = function(c){ return c.tasks.map(function(t){ return t.due || '9999'; }).sort()[0]; };
  var clusters = res.clusters.sort(function(a, b){
    var ad = firstDue(a), bd = firstDue(b);
    return ad !== bd ? (ad < bd ? -1 : 1) : b.tasks.length - a.tasks.length;
  });
  var html = clusters.map(function(c){
    var cat = majorityCat(c.tasks), next = firstDue(c);
    return groupHtml('rel:' + c.label, '<span class="gdot"></span><b>' + esc(c.label) + '</b><span class="gcount num">' + c.tasks.length + '件</span>' +
      (next !== '9999' ? '<span class="gsub num">次の期限 ' + fmtMD(next) + '</span>' : ''),
      orderWithChildren(c.tasks).map(function(o){ return taskRow(o.t, { mode:'rel', child:o.child, last:o.last }); }).join(''), '', '--h:' + cat.h);
  }).join('');
  if(res.singles.length){
    html += groupHtml('rel:__single', '<b>単発のタスク</b><span class="gcount num">' + res.singles.length + '</span>',
      res.singles.sort(cmp).map(function(t){ return taskRow(t, { mode:'rel' }); }).join(''));
  }
  el.list.innerHTML = html;
}
function majorityCat(tasks){
  var f = {}, best = CAT_OTHER, n = 0;
  tasks.forEach(function(t){ var c = categoryOf(t); f[c.k] = (f[c.k] || 0) + 1; if(f[c.k] > n){ n = f[c.k]; best = c; } });
  return best;
}

function renderFlat(tasks){
  if(!tasks.length){ el.list.innerHTML = emptyState(state.prefs.view); return; }
  el.list.innerHTML = '<div class="card glass"><ul class="tasks">' + tasks.map(function(t){ return taskRow(t, {}); }).join('') + '</ul></div>';
}

function renderDone(){
  var done = doneTasks().sort(function(a,b){ return b.doneAt - a.doneAt; });
  el.viewTools.innerHTML = done.length
    ? '<button class="btn" data-copy="today">' + icon('copy') + '今日の実績をコピー</button>' +
      '<button class="btn" data-copy="week">' + icon('copy') + '今週の実績をコピー</button>'
    : '';
  if(!done.length){ el.list.innerHTML = emptyState('done'); return; }
  var days = {}, order = [];
  done.forEach(function(t){ var k = dayKey(t.doneAt); if(!days[k]){ days[k] = []; order.push(k); } days[k].push(t); });
  var T = today();
  el.list.innerHTML = order.slice(0, 60).map(function(k){
    var n = diffDays(parseYmd(k), T);
    var label = n === 0 ? '今日' : n === 1 ? '昨日' : fmtMD(k);
    var collapsed = !!state.prefs.collapsed[collapseKey(k)];
    return '<section class="group"><div class="group-row">' +
      '<button class="group-head' + (collapsed ? '' : ' open') + '" data-group="' + k + '" aria-expanded="' + !collapsed + '">' + icon('chevron', 'chev') +
      '<b>' + label + '</b><span class="gcount num">' + days[k].length + '件</span>' + (n <= 1 ? '<span class="gsub num">' + fmtMD(k) + '</span>' : '') + '</button>' +
      '<button class="btn ghost sm gcopy" data-copy="day" data-day="' + k + '" title="この日の実績をコピー">' + icon('copy') + 'コピー</button></div>' +
      (collapsed ? '' : '<div class="card glass"><ul class="tasks">' + days[k].map(function(t){ return taskRow(t, { group:'done' }); }).join('') + '</ul></div>') +
      '</section>';
  }).join('');
}

function taskRow(t, ctx){
  ctx = ctx || {};
  var T = today(), chips = [];
  var isDone = t.status === 'done';
  var parent = t.parentId ? byId(t.parentId) : null;

  if(isDone){
    chips.push('<span class="chip ghost num">' + icon('check') + hm(t.doneAt) + ' 完了</span>');
    if(parent) chips.push('<span class="chip link">' + icon('branch') + esc(parentLabel(parent)) + '</span>');
  }else{
    if(ctx.mode !== 'cat' && !ctx.child) chips.push(catChip(categoryOf(t), true));
    if(parent && !ctx.child) chips.push('<span class="chip link" title="「' + esc(parent.title) + '」の付属作業">' + icon('branch') + esc(parentLabel(parent)) + '</span>');
    if(t.urgent) chips.push('<span class="chip urgent">' + icon('bolt') + '急ぎ</span>');
    if(t.due && ctx.group !== 'today' && ctx.group !== 'tomorrow'){
      var di = dueInfo(t.due);
      if(ctx.group === 'week' || ctx.group === 'next') di = { text: fmtMD(t.due), cls:'', title: di.title };
      chips.push('<span class="chip num ' + di.cls + '" title="' + esc(di.title) + '">' + icon('cal') + di.text + '</span>');
    }
    if(t.status === 'waiting'){
      var since = t.waitingSince ? diffDays(parseYmd(t.waitingSince), T) : 0;
      var who = t.person ? esc(t.person) + 'の' : '';
      chips.push('<span class="chip wait' + (since >= 5 ? ' long' : '') + '">' + icon('hourglass') + who + '返事待ち・' + (since === 0 ? '今日から' : since + '日目') + '</span>');
      if(since >= 7) chips.push('<span class="chip urgent">' + icon('bell') + 'そろそろ確認を</span>');
    }else if(t.person){
      chips.push('<span class="chip">' + icon('user') + esc(t.person) + '</span>');
    }
    if(t.recur) chips.push('<span class="chip recur">' + icon('repeat') + recurLabel(t.recur) + '</span>');
    var kids = childrenOf(t.id);
    if(kids.length){
      var kd = kids.filter(function(k){ return k.status === 'done'; }).length;
      chips.push('<button class="chip prog num' + (kd === kids.length ? ' full' : '') + '" data-act="subs" title="付属作業を管理 (S)">' + icon('layers') + '付属 ' + kd + '/' + kids.length + '</button>');
    }
  }
  if(t.note && !openNotes[t.id]) chips.push('<button class="chip" data-act="note" title="メモを開く">' + icon('note') + 'メモ</button>');

  var actions = '';
  if(isDone){
    actions = '<button class="qa" data-act="toggle">戻す</button>';
  }else if(t.status === 'waiting'){
    actions = '<button class="qa go" data-act="reply" title="今日のタスクに戻す">返事きた</button>';
  }else if(t.someday){
    actions = '<button class="qa" data-act="today">今日やる</button>';
  }else{
    var isToday = t.due === todayStr();
    if(!isToday) actions += '<button class="qa" data-act="today" title="今日やる (T)">今日</button>';
    if(t.due !== ymd(addDays(T,1))) actions += '<button class="qa' + (isToday ? '' : ' hide-sm') + '" data-act="tomorrow" title="明日にまわす (M)">明日</button>';
  }
  actions += '<button class="more" data-act="menu" aria-label="その他の操作" title="その他 (.)">' + icon('dots') + '</button>';

  var note = openNotes[t.id]
    ? '<div class="t-note"><textarea data-note="' + t.id + '" placeholder="メモ（連絡先、経緯、参考資料の場所など）">' + esc(t.note) + '</textarea><div class="saved"></div></div>'
    : '';
  var cls = 'task' + (t.urgent && !isDone ? ' urgent' : '') + (isDone ? ' is-done' : '') + (justAdded[t.id] ? ' enter' : '') +
    (ctx.child ? ' child' : '') + (ctx.last ? ' last' : '');
  return '<li class="' + cls + '" data-id="' + t.id + '" tabindex="0">' +
    '<button class="check" data-act="toggle" aria-label="' + (isDone ? '未完了に戻す' : '完了にする') + '" title="' + (isDone ? '未完了に戻す' : '完了 (X)') + '">' + icon('check') + '</button>' +
    '<div class="t-body"><div class="t-title" data-act="edit" title="クリックで編集">' + esc(t.title) + '</div>' +
    '<div class="t-meta">' + chips.join('') + '</div>' + note + '</div>' +
    '<div class="t-actions">' + actions + '</div></li>';
}

  '<path d="M10 53h26M20 58h22" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round" opacity=".6" fill="none"/></svg>';

function emptyState(view){

  if(view === 'waiting') return simple('hourglass', '返事待ちはありません', '照会・決裁・メールの返信など「相手ボール」のものを置いておく場所です。<br>「待ち」と書くか、「@相手」を付けると便利です。',

    '<div class="tip"><b>① 書き出すだけ</b>「明日」「金曜まで」「10/15」などの日付や「！」を自動で読み取ります。複数行の貼り付けもOK。</div>' +
    '<div class="tip"><b>② 自動で整理</b>カテゴリ分け、関連タスクのまとめ、会議なら「会場予約・議事録」などの付属作業も期限から逆算して追加。</div>' +
    '<div class="tip"><b>③ 片付けるほど晴れる</b>今日の分を終えるほど、背景のモヤが晴れて青空に。迷ったら集中モードで1件ずつ。</div>' +
    '</div></div>';
}

   Preview under the input
   ============================================================ */
function updatePreview(){
  var lines = splitLines(el.input.value);
  if(!lines.length){
    mailMode = true;
    el.preview.innerHTML = '<span class="hint idle">日付・<b>！</b>（急ぎ）・<b>@相手</b>・<b>待ち</b>・<b>毎週</b> を読み取り、カテゴリ・関連・付属作業まで自動で整理　｜　<b>Shift+Enter</b> で改行</span>';
    return;
  }
  var raw = el.input.value;
  if(looksLikeMail(raw) && mailMode){
    var mp = extractMail(raw), mc = [];
    if(mp.due) mc.push('<span class="chip today num">' + icon('cal') + '期限 ' + fmtMD(mp.due) + '</span>');
    if(mp.person) mc.push('<span class="chip">' + icon('user') + esc(mp.person) + '</span>');
    if(mp.urgent) mc.push('<span class="chip urgent">' + icon('bolt') + '急ぎ</span>');
    el.preview.innerHTML = '<span class="chip prog">' + icon('mail') + 'メールから1件のタスクに</span><span class="hint">「<b>' + esc(short(mp.title, 30)) + '</b>」</span>' + mc.join('') +
      '<button class="linkbtn" data-pm="lines">1行ずつ追加にする</button>';
    return;
  }
  if(lines.length > 1){
    el.preview.innerHTML = '<span class="chip today">' + icon('plus') + lines.length + '件まとめて書き出す</span><span class="hint">1行が1タスクになり、それぞれ自動で整理します</span>' +
      (looksLikeMail(raw) ? '<button class="linkbtn" data-pm="mail">メールとして1件にする</button>' : '');
    return;
  }
  var p = parse(lines[0]), chips = [];
  var view = state.prefs.view === 'done' ? 'all' : state.prefs.view;
  var t = makeTask(p, view);
  chips.push(catChip(categorize(t.title)));
  if(t.due){
    var di = dueInfo(t.due);
    chips.push('<span class="chip num ' + (di.cls === 'over' ? 'over' : 'today') + '">' + icon('cal') + fmtMD(t.due) + (di.cls === 'over' ? '' : '・' + (di.text === fmtMD(t.due) ? diffDays(today(), parseYmd(t.due)) + '日後' : di.text)) + '</span>');
  }
  if(t.urgent) chips.push('<span class="chip urgent">' + icon('bolt') + '急ぎ</span>');
  if(t.status === 'waiting') chips.push('<span class="chip wait">' + icon('hourglass') + (t.person ? esc(t.person) + 'の' : '') + '返事待ち</span>');
  else if(t.person) chips.push('<span class="chip">' + icon('user') + esc(t.person) + '</span>');
  if(t.recur) chips.push('<span class="chip recur">' + icon('repeat') + recurLabel(t.recur) + '</span>');
  if(t.someday) chips.push('<span class="chip someday">' + icon('cloud') + 'いつか</span>');
  var rule = (t.status === 'open' && !t.someday && !t.recur) ? matchRule(t.title, false) : null;
  if(rule) chips.push('<span class="chip prog">' + icon('layers') + '付属作業 ' + rule.items.length + '件' + (state.prefs.autoSub ? 'も追加' : 'を提案') + '</span>');
  el.preview.innerHTML = '<span class="hint">「<b>' + esc(short(t.title, 26)) + '</b>」</span>' + chips.join('');
}

   Inline edit & notes
   ============================================================ */
function startEdit(row){
  var id = row.dataset.id, t = byId(id); if(!t) return;
  var titleEl = row.querySelector('.t-title');
  if(!titleEl || row.querySelector('.t-edit')) return;
  editing = true;
  var input = document.createElement('input');
  input.className = 't-edit';
  input.value = t.title;
  input.setAttribute('aria-label', 'タスク名を編集');
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  var done = false;
  function finish(save){
    if(done) return; done = true;
    if(save) renameTask(id, input.value);
    else { editing = false; render(); }
    var r = rowEl(id); if(r) r.focus();
  }
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); }
  });
  input.addEventListener('blur', function(){ finish(true); });
}
function toggleNote(id){
  openNotes[id] = !openNotes[id];
  renderView();
  if(openNotes[id]){
    var ta = el.list.querySelector('textarea[data-note="' + id + '"]');
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}
var noteTimer = null;
el.list.addEventListener('input', function(e){
  var ta = e.target.closest('textarea[data-note]'); if(!ta) return;
  var t = byId(ta.dataset.note); if(!t) return;
  t.note = ta.value;
  clearTimeout(noteTimer);
  var s = ta.parentNode.querySelector('.saved'); if(s) s.textContent = '';
  noteTimer = setTimeout(function(){ persist(); if(s) s.textContent = '保存しました'; }, 400);
});

   Menu

var menuFor = null;
function openMenu(anchor, id){
  var t = byId(id); if(!t) return;
  menuFor = id;
  var T = today(), items = [];
  function item(act, ic, label, k, cls){ items.push('<button role="menuitem" data-m="' + act + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + icon(ic) + '<span>' + label + '</span>' + (k ? '<span class="k">' + k + '</span>' : '') + '</button>'); }
  function hr(){ items.push('<hr>'); }

  if(t.status === 'done'){
    item('undone', 'back', '未完了に戻す');
    item('note', 'note', openNotes[id] ? 'メモを閉じる' : 'メモ');
    hr();
    item('delete', 'trash', '削除', 'Del', 'danger');
  }else{
    if(t.status === 'waiting'){
      item('reply', 'back', '返事がきた（今日へ）');
      item('nudge', 'bell', '催促した（日数をリセット）');
      item('wait', 'user', '相手を変更…');
      item('unwait', 'inbox', '待ちを解除');
      hr();
    }
    item('today', 'sun', '今日', 'T');
    item('tomorrow', 'skip', '明日', 'M');
    item('nextweek', 'cal', '来週月曜（' + fmtMD(ymd(addDays(mondayOf(T), 7))) + '）');
    item('date', 'cal', '日付を選ぶ…', 'D');
    if(t.due) item('nodate', 'calx', '日付を外す');
    hr();
    item('subs', 'layers', t.parentId && byId(t.parentId) ? '親タスクの付属作業…' : '付属作業…', 'S');
    item('cat', 'tag', 'カテゴリ：' + categoryOf(t).name, 'C');
    item('urgent', 'bolt', t.urgent ? '急ぎを解除' : '急ぎにする', 'U');
    if(t.status !== 'waiting') item('wait', 'hourglass', '待ちにする…', 'W');
    item('someday', 'cloud', t.someday ? 'いつかから戻す' : 'いつかへ');
    item('recur', 'repeat', t.recur ? '繰り返し：' + recurLabel(t.recur) : '繰り返し…');
    item('note', 'note', openNotes[id] ? 'メモを閉じる' : 'メモ', 'N');
    item('rename', 'pen', '名前を変更', 'E');
    hr();
    item('delete', 'trash', '削除', 'Del', 'danger');
  }
  el.menu.innerHTML = items.join('');
  el.menu.hidden = false;
  var r = anchor.getBoundingClientRect(), mw = el.menu.offsetWidth, mh = el.menu.offsetHeight;
  var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
  var top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  el.menu.style.left = left + 'px';
  el.menu.style.top = top + 'px';
  var first = el.menu.querySelector('button'); if(first) first.focus();
}
function closeMenu(refocus){
  if(el.menu.hidden) return;
  el.menu.hidden = true;
  var id = menuFor; menuFor = null;
  if(refocus && id){ var r = rowEl(id); if(r) r.focus(); }
}
el.menu.addEventListener('click', function(e){
  var b = e.target.closest('[data-m]'); if(!b) return;
  var id = menuFor; closeMenu(false);
  runAction(b.dataset.m, id);
});
el.menu.addEventListener('keydown', function(e){
  var btns = Array.prototype.slice.call(el.menu.querySelectorAll('button'));
  var i = btns.indexOf(document.activeElement);
  if(e.key === 'ArrowDown'){ e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
  else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closeMenu(true); }
  else if(e.key === 'Tab'){ closeMenu(true); }
});
document.addEventListener('mousedown', function(e){
  if(!el.menu.hidden && !el.menu.contains(e.target) && !e.target.closest('[data-act="menu"]')) closeMenu(false);
});
window.addEventListener('resize', function(){ closeMenu(false); });
window.addEventListener('scroll', function(){ closeMenu(false); }, { passive:true });

function runAction(act, id){
  var T = today(), t = byId(id); if(!t) return;
  switch(act){
    case 'today': setDue(id, T, '今日'); break;
    case 'tomorrow': setDue(id, addDays(T,1), '明日'); break;
    case 'nextweek': setDue(id, addDays(mondayOf(T),7), '来週月曜'); break;
    case 'nodate': setDue(id, null); break;
    case 'date': dateDialog(id); break;
    case 'urgent': toggleUrgent(id); break;
    case 'wait': waitDialog(id); break;
    case 'unwait': mutate(function(){ t.status = 'open'; t.waitingSince = null; }, '待ちを解除しました'); break;
    case 'reply': replyCame(id); break;
    case 'nudge': nudged(id); break;
    case 'someday': toSomeday(id); break;
    case 'recur': recurDialog(id); break;
    case 'note': toggleNote(id); break;
    case 'rename': var r = rowEl(id); if(r) startEdit(r); break;
    case 'undone': toggleDone(id, null); break;
    case 'delete': removeTask(id); break;
    case 'cat': catDialog(id); break;
    case 'subs': subsDialog(t.parentId && byId(t.parentId) ? t.parentId : id); break;
  }
}

    }).join('') + '</div>';

      ? (suggestions.length ? '<div class="dlg-list">' + suggestions.map(function(it, i){

      : '<p class="lead" style="margin:0">上のテンプレートから選ぶか、下に自分で書いて追加できます。</p>';

function reportTitle(t){ var p = t.parentId && byId(t.parentId); return p ? parentLabel(p) + '：' + t.title : t.title; }
function reportText(fromKey, toKey){
  var list = doneTasks().filter(function(t){ var k = dayKey(t.doneAt); return k >= fromKey && k <= toKey; })
    .sort(function(a,b){ return a.doneAt - b.doneAt; });
  if(!list.length) return '';
  var days = {}, order = [];
  list.forEach(function(t){ var k = dayKey(t.doneAt); if(!days[k]){ days[k] = []; order.push(k); } days[k].push(t); });
  return order.map(function(k){
    var d = parseYmd(k);
    return '■ ' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + WDJ[d.getDay()] + '）\n' + days[k].map(function(t){ return '・' + reportTitle(t); }).join('\n');
  }).join('\n\n');
}
function copyReport(kind, day){
  var T = today(), text;
  if(kind === 'today') text = reportText(todayStr(), todayStr());
  else if(kind === 'week') text = reportText(ymd(mondayOf(T)), todayStr());
  else text = reportText(day, day);
  if(!text){ toast('コピーする完了タスクがありません'); return; }
  copyText(text, function(ok){ toast(ok ? '実績をコピーしました。日報・週報に貼り付けできます' : 'コピーできませんでした'); });
}
function copyText(text, cb){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); cb(ok);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){ cb(true); }, fallback);
  }else fallback();
}

var F = { queue:[], i:0, timerEnd:0, timerTotal:0, tick:null };
function focusQueue(){
  var picks = (todaysPicks() || []).filter(function(t){ return t.status === 'open' && !t.someday; });
  var ids = {}; picks.forEach(function(t){ ids[t.id] = 1; });
  var q = picks.concat(todayTasks().filter(function(t){ return !ids[t.id]; }).sort(cmp));
  if(!q.length) q = openTasks().sort(cmp);
  return q.map(function(t){ return t.id; });
}
function openFocus(){ closeMenu(false); F.queue = focusQueue(); F.i = 0; el.focus.hidden = false; renderFocus(); }
function closeFocus(){ el.focus.hidden = true; stopTimer(); render(); }
function renderFocus(){
  F.queue = F.queue.filter(function(id){ var t = byId(id); return t && t.status === 'open'; });
  if(F.i >= F.queue.length) F.i = 0;
  var close = '<button class="icon-btn focus-close" data-f="close" title="閉じる (Esc)" aria-label="閉じる">' + icon('x') + '</button>';
  if(!F.queue.length){
    el.focus.innerHTML = close + '<div class="focus-card"><div class="empty" style="padding:0"><div class="art">' + WX.sun + '</div>' +
      '<h3 style="font-size:22px">すっかり晴れました</h3><p>やることは全部片付きました。ひと息つきましょう。</p>' +
      '<div class="focus-actions"><button class="btn" data-f="close">戻る</button></div></div></div>';
    return;
  }
  var t = byId(F.queue[F.i]);
  var chips = [catChip(categoryOf(t))];
  var p = t.parentId && byId(t.parentId);
  if(p) chips.push('<span class="chip link">' + icon('branch') + esc(parentLabel(p)) + '</span>');
  if(t.urgent) chips.push('<span class="chip urgent">' + icon('bolt') + '急ぎ</span>');
  if(t.due){ var di = dueInfo(t.due); chips.push('<span class="chip num ' + di.cls + '">' + icon('cal') + (di.cls === 'over' ? di.text : '期限 ' + di.text) + '</span>'); }
  if(t.person) chips.push('<span class="chip">' + icon('user') + esc(t.person) + '</span>');
  var dots = F.queue.length <= 12 ? '<div class="focus-progress">' + F.queue.map(function(_, i){ return '<i class="' + (i === F.i ? 'cur' : '') + '"></i>'; }).join('') + '</div>' : '';
  el.focus.innerHTML = close +
    '<div class="focus-card">' +
    '<div class="focus-eyebrow"><span class="dot"></span>いま取り組むこと<span class="num">　' + (F.i + 1) + ' / ' + F.queue.length + '</span></div>' +
    '<div class="focus-title">' + esc(t.title) + '</div>' +
    '<div class="focus-meta">' + chips.join('') + '</div>' +
    (t.note ? '<div class="focus-note">' + esc(t.note) + '</div>' : '') +
    '<div class="timer" id="fTimer"></div>' +
    '<div class="focus-actions"><button class="btn" data-f="skip">' + icon('skip') + 'あとで</button><button class="btn primary" data-f="done">' + icon('check') + '完了</button></div>' + dots +
    '<div class="focus-hint">Enter で完了　・　→ であとで　・　Esc で閉じる</div></div>';
  renderTimer();
  var pb = el.focus.querySelector('[data-f="done"]'); if(pb) pb.focus();
}
function renderTimer(){
  var box = $('#fTimer'); if(!box) return;
  if(!F.timerEnd){
    box.className = 'timer';
    box.innerHTML = '<div class="timer-picks">タイマー：' + [15,25,50].map(function(m){ return '<button data-timer="' + m + '">' + m + '分</button>'; }).join('') + '</div>';
    return;
  }
  var left = Math.max(0, F.timerEnd - Date.now());
  var mm = Math.floor(left / 60000), ss = Math.floor(left / 1000) % 60;
  box.className = 'timer' + (left === 0 ? ' ring' : '');
  box.innerHTML = '<div class="timer-time num">' + (left === 0 ? '時間です' : pad(mm) + ':' + pad(ss)) + '</div>' +
    '<div class="timer-bar"><i style="width:' + (100 * (1 - left / F.timerTotal)) + '%"></i></div>' +
    '<div class="timer-picks"><button data-timer="stop">タイマーを止める</button></div>';
}
function startTimer(min){
  F.timerTotal = min * 60000; F.timerEnd = Date.now() + F.timerTotal;
  clearInterval(F.tick);
  F.tick = setInterval(function(){
    if(el.focus.hidden) return;
    renderTimer();
    if(F.timerEnd - Date.now() <= 0){ clearInterval(F.tick); document.title = '⏰ 時間です - さくっとタスク'; }
  }, 1000);
  renderTimer();
}
function stopTimer(){ clearInterval(F.tick); F.timerEnd = 0; F.timerTotal = 0; renderTimer(); }
function focusDone(){
  var id = F.queue[F.i]; if(!id) return;
  var snap = JSON.stringify(state.tasks);
  var next = completeTask(id);
  persist();
  undoStack = snap;
  F.queue.splice(F.i, 1);
  if(next && next.due <= todayStr()) F.queue.push(next.id);
  if(F.i >= F.queue.length) F.i = 0;
  renderHeader();
  if(!F.queue.length) sunburst();
  renderFocus();
  toast('完了！' + (F.queue.length ? '次はこれです' : ''), { action:'元に戻す', onAction: function(){ undo(); F.queue = focusQueue(); renderFocus(); } });
}
function focusSkip(){ if(F.queue.length){ F.i = (F.i + 1) % F.queue.length; renderFocus(); } }
el.focus.addEventListener('click', function(e){
  var b = e.target.closest('[data-f],[data-timer]'); if(!b) return;
  if(b.dataset.f === 'close') closeFocus();
  else if(b.dataset.f === 'done') focusDone();
  else if(b.dataset.f === 'skip') focusSkip();
  else if(b.dataset.timer === 'stop') stopTimer();
  else if(b.dataset.timer) startTimer(+b.dataset.timer);
});

/* ============================================================
   Sunburst — light rising as the mist clears
   ============================================================ */
function reducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function sunburst(){
  if(reducedMotion() || state.prefs.lite) return;
  var g = document.createElement('div'); g.className = 'glow'; document.body.appendChild(g);
  setTimeout(function(){ g.remove(); }, 2600);
  var c = el.burst, ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var colors = ['255,226,150','255,244,214','255,255,255','255,205,130','214,228,255'];
  var ps = [];
  for(var i = 0; i < 90; i++){
    ps.push({ x: Math.random() * innerWidth, y: innerHeight * (0.55 + Math.random() * 0.5), vy: -(0.6 + Math.random() * 1.8),
      sway: Math.random() * 6.28, r: 1.5 + Math.random() * 3.5, c: colors[i % colors.length], life: 0.6 + Math.random() * 0.4 });
  }
  var start = performance.now(), D = 2600;
  (function frame(now){
    var t = now - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(function(p){
      p.y += p.vy; p.sway += 0.04; var x = p.x + Math.sin(p.sway) * 14;
      var a = Math.max(0, Math.min(1, t / 300) * (1 - t / (D * p.life)));
      var grd = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r * 4);
      grd.addColorStop(0, 'rgba(' + p.c + ',' + a + ')');
      grd.addColorStop(1, 'rgba(' + p.c + ',0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 4, 0, 6.29); ctx.fill();
    });
    if(t < D) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(start);
}

/* ============================================================
   Today's 3 — scoring and card
   ============================================================ */
function scoreTask(t){
  var T = today(), sc = 5, why = '日付なし';
  if(t.due){
    var n = diffDays(T, parseYmd(t.due));
    if(n < 0){ sc = 100 + Math.min(-n, 10) * 5; why = (-n) + '日超過'; }
    else if(n === 0){ sc = 80; why = '今日が期限'; }
    else if(n === 1){ sc = 50; why = '明日が期限'; }
    else if(n <= 3){ sc = 35; why = fmtMD(t.due) + 'が期限'; }
    else if(n <= 7){ sc = 20; why = fmtMD(t.due) + 'が期限'; }
    else { sc = 8; why = fmtMD(t.due) + 'が期限'; }
  }else{
    var age = Math.floor((Date.now() - t.createdAt) / 86400000);
    if(age >= 14){ sc = 12; why = age + '日前から残っている'; }
  }
  if(t.urgent){ sc += 40; why = '急ぎ・' + why; }
  return { score: sc, why: why };
}
function suggestPicks(exclude){
  return openTasks().filter(function(t){ return !(exclude && exclude[t.id]); })
    .map(function(t){ return { t: t, s: scoreTask(t) }; })
    .sort(function(a, b){ return b.s.score - a.s.score || cmp(a.t, b.t); });
}
function todaysPicks(){
  var p = state.prefs.picks;
  return p && p.date === todayStr() ? p.ids.map(byId).filter(Boolean) : null;
}
function renderPicks(){
  var v = state.prefs.view;
  if(v !== 'all' && v !== 'today'){ el.picks.innerHTML = ''; return; }
  var picks = todaysPicks();
  if(!picks || !picks.length){
    el.picks.innerHTML = openTasks().length

/* ============================================================
   Morning review — triage overdue / stale waiting, then pick today's 3
   ============================================================ */
var M = { phase:'review', queue:[], i:0, chosen:[] };
function morningQueue(){
  var T = today();
  var over = overdueTasks().sort(cmp);
  var stale = waitingTasks().filter(function(t){ return t.waitingSince && diffDays(parseYmd(t.waitingSince), T) >= 7; });
  return over.concat(stale).map(function(t){ return t.id; });
}
function initPick(){
  var cur = todaysPicks();
  M.chosen = cur ? cur.filter(function(t){ return t.status === 'open' && !t.someday; }).map(function(t){ return t.id; }) : [];
  if(!M.chosen.length) M.chosen = suggestPicks().slice(0, 3).map(function(x){ return x.t.id; });
}
function openMorning(phase){
  closeMenu(false);
  if(!el.focus.hidden) closeFocus();
  state.prefs.lastMorning = todayStr(); persist();
  M.queue = morningQueue(); M.i = 0;
  M.phase = phase || (M.queue.length ? 'review' : 'pick');
  if(M.phase === 'pick') initPick();
  el.morning.hidden = false;
  renderMorning();
}
function closeMorning(){ el.morning.hidden = true; render(); }
function renderMorning(){
  var close = '<button class="icon-btn focus-close" data-mg="close" title="閉じる (Esc)" aria-label="閉じる">' + icon('x') + '</button>';

  if(M.phase === 'review'){
    while(M.i < M.queue.length){
      var c = byId(M.queue[M.i]);
      if(c && (c.status === 'waiting' || (c.status === 'open' && !c.someday && c.due && c.due < todayStr()))) break;
      M.i++;
    }
    if(M.i >= M.queue.length){ M.phase = 'pick'; initPick(); }
  }
  if(M.phase === 'review'){
    var t = byId(M.queue[M.i]), waiting = t.status === 'waiting', chips = [catChip(categoryOf(t))], why;
    var p = t.parentId && byId(t.parentId);
    if(p) chips.push('<span class="chip link">' + icon('branch') + esc(parentLabel(p)) + '</span>');
    if(waiting){
      var days = t.waitingSince ? diffDays(parseYmd(t.waitingSince), T) : 0;
      chips.push('<span class="chip wait long">' + icon('hourglass') + (t.person ? esc(t.person) + 'の' : '') + '返事待ち・' + days + '日目</span>');

    }else{

      chips.push('<span class="chip over">' + icon('cal') + dueInfo(t.due).text + '</span>');
      why = '期限（' + fmtMD(t.due) + '）を <b>' + (-diffDays(T, parseYmd(t.due))) + '日</b> 過ぎています。いつやるか、決め直しましょう。';
    }
    var b = function(a, label, k, cls){ return '<button class="btn' + (cls ? ' ' + cls : '') + '" data-mg="' + a + '">' + label + (k ? '<kbd>' + k + '</kbd>' : '') + '</button>'; };
    var acts = waiting
      ? b('today', '返事きた → 今日やる', 'T', 'primary') + b('nudge', '催促した', 'R') + b('skip', 'このまま待つ', '→') + b('done', 'もう終わった', 'X')
      : b('today', '今日やる', 'T', 'primary') + b('tomorrow', '明日', 'M') + b('nextweek', '来週月曜', 'W') + b('someday', 'いつか', 'S') + b('done', 'もう終わった', 'X') + b('delete', 'やらない', 'Del', 'danger');
    el.morning.innerHTML = close + '<div class="focus-card">' +
      '<div class="focus-eyebrow"><span class="dot"></span>朝の整理<span class="num">　' + (M.i + 1) + ' / ' + M.queue.length + '</span></div>' +
      '<div class="focus-title">' + esc(t.title) + '</div><div class="focus-meta">' + chips.join('') + '</div>' +
      '<div class="mg-why">' + why + '</div><div class="mg-actions">' + acts + '</div>' +

    var pb = el.morning.querySelector('.btn.primary'); if(pb) pb.focus();

  }

  M.chosen = M.chosen.filter(function(id){ var x = byId(id); return x && x.status === 'open' && !x.someday; });
  if(!openTasks().length){
    el.morning.innerHTML = close + '<div class="focus-card"><div class="empty" style="padding:0"><div class="art">' + WX.sun + '</div>' +
      '<h3 style="font-size:22px">やることは空っぽです</h3><p>思いついたことを書き出すところから始めましょう。</p>' +
      '<div class="focus-actions"><button class="btn primary" data-mg="close">はじめる</button></div></div></div>';

  }

    var x = byId(id);
    return '<div class="mg-item"><span class="pick-no">' + (i + 1) + '</span><div><div class="t">' + esc(reportTitle(x)) + '</div><div class="w">' + esc(scoreTask(x).why) + '</div></div>' +
      '<button class="icon-btn" data-mg="drop" data-id="' + id + '" title="外す" aria-label="外す">' + icon('x') + '</button></div>';
  }).join('');

    '<div class="mg-list">' + (list || '<div class="mg-why">下の候補から選んでください。</div>') + '</div>' +
    (cands.length ? '<div class="mg-more"><span class="lbl">ほかの候補：</span>' + cands.map(function(c){
      return '<button data-mg="add" data-id="' + c.t.id + '" title="' + esc(reportTitle(c.t) + '：' + c.s.why) + '">＋ ' + esc(short(reportTitle(c.t), 22)) + '</button>';
    }).join('') + '</div>' : '') +
    '<div class="focus-actions"><button class="btn" data-mg="focus"' + (M.chosen.length ? '' : ' disabled') + '>' + icon('target') + '決めて集中モードへ</button>' +
    '<button class="btn primary" data-mg="decide"' + (M.chosen.length ? '' : ' disabled') + '>' + icon('check') + 'この' + M.chosen.length + 'つで始める</button></div>' +
    '<div class="focus-hint">Enter で決定　・　Esc で閉じる</div></div>';
  var db = el.morning.querySelector('[data-mg="decide"]'); if(db && !db.disabled) db.focus();
}
function morningAct(a){
  var id = M.queue[M.i], t = byId(id), T = today();
  if(t && a !== 'skip'){
    if(t.status === 'waiting'){
      if(a === 'today') replyCame(id);
      else if(a === 'nudge') nudged(id);
      else if(a === 'done') mutate(function(){ completeTask(id); }, '完了にしました');
      else if(a === 'delete') removeTask(id);
      else return;
    }else{
      if(a === 'today') setDue(id, T, '今日');
      else if(a === 'tomorrow') setDue(id, addDays(T, 1), '明日');
      else if(a === 'nextweek') setDue(id, addDays(mondayOf(T), 7), '来週月曜');
      else if(a === 'someday') toSomeday(id);
      else if(a === 'done') mutate(function(){ completeTask(id); }, '完了にしました');
      else if(a === 'delete') removeTask(id);
      else return;
    }
  }
  M.i++;
  if(M.i >= M.queue.length){ M.phase = 'pick'; initPick(); }
  renderMorning();
}
function decidePicks(goFocus){
  if(!M.chosen.length) return;
  state.prefs.picks = { date: todayStr(), ids: M.chosen.slice() };
  persist();
  el.morning.hidden = true;
  render();
  if(goFocus) openFocus();
  else toast('今日の' + M.chosen.length + 'つを決めました。上から順に片付けましょう');
}
function morningKey(e){
  if(e.key === 'Escape'){ e.preventDefault(); closeMorning(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(M.phase === 'review'){
    var map = { t:'today', m:'tomorrow', w:'nextweek', s:'someday', x:'done', Delete:'delete', r:'nudge', ArrowRight:'skip' };
    if(map[e.key]){ e.preventDefault(); morningAct(map[e.key]); }
  }else if(e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))){
    e.preventDefault(); decidePicks(false);
  }
}
function shouldAutoMorning(){
  return state.prefs.morningAuto && state.prefs.lastMorning !== todayStr() && (openTasks().length + waitingTasks().length) > 0;
}

   ============================================================ */
var mailMode = true;
var MAIL_HINT = /^(件名|Subject|差出人|From|宛先|To)\s*[:：]|お疲れ様|お疲れさま|お世話になって|各位|(締切|〆切|締め切り|期限|期日)\s*[:：]/im;
var GREET_RE = /(様|各位|殿|御中)\s*$|^(お疲れ|お世話|いつも|お忙しい|宛先|To\s*[:：]|From\s*[:：]|差出人|送信日時|日時|CC|Cc|件名|Subject|よろしく|以上|--|──)/;
var DEPT_RE = /([一-龠々ヵヶァ-ヴーA-Za-z0-9]+?(?:課|室|局|部|係|センター|グループ|事務所))/;
function looksLikeMail(raw){ return /\n/.test(raw.trim()) && MAIL_HINT.test(raw); }
function findDate(str){
  var t = today(), s = toHalf(str);
  for(var i = 0; i < DATE_RULES.length; i++){
    var m = s.match(DATE_RULES[i][0]);
    if(m){ var d = DATE_RULES[i][1](m, t); if(d) return ymd(d); }
  }
  return null;
}
function extractMail(raw){
  var lines = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var title = '', due = null, person = '', m;
  lines.some(function(l){ m = l.match(/^(?:件名|Subject|タイトル)\s*[:：]\s*(.+)$/i); if(m){ title = m[1]; return true; } return false; });
  if(!title){
    var body = lines.filter(function(l){ return !GREET_RE.test(l) && !/^(締切|〆切|期限|期日|回答先|提出先|担当|連絡先|問合せ先|問い合わせ先)/.test(l); });
    title = body.filter(function(l){ return /について|の件|照会|依頼|お願い|ご案内|通知|調査|提出|回答/.test(l); })[0] || body[0] || lines[0];
  }
  title = title.replace(/^((re|fw|fwd|転送)\s*[:：]\s*)+/i, '')
    .replace(/^[■□●◆◇・\-\s]+/, '')
    .replace(/(を|の)?(ご)?(お願い(いた)?します|お願い申し上げます|ください)[。．]?$/, '')
    .replace(/[。．]$/, '').trim();
  if(title.length > 60) title = title.slice(0, 60) + '…';
  lines.some(function(l){
    if(/(締切|〆切|締め切り|期限|期日|提出日|回答日|まで)/.test(l)){ var d = findDate(l); if(d){ due = d; return true; } }
    return false;
  });
  lines.some(function(l){
    if(/(回答先|提出先|問合せ先|問い合わせ先|担当|送付先|連絡先|差出人|From)/i.test(l)){ var mm = l.replace(/^[^:：]*[:：]/, '').match(DEPT_RE); if(mm){ person = mm[1]; return true; } }
    return false;
  });
  return { title: title || '（メールの件名なし）', due: due, person: person, urgent: /至急|緊急/.test(raw), waiting:false, someday:false, recur:null, note: raw.trim().slice(0, 4000) };
}

function printList(){

  var sec = function(h, items){ return items.length ? '<h2>' + h + '</h2><ul>' + items.join('') + '</ul>' : ''; };
  var picks = (todaysPicks() || []).filter(function(t){ return t.status === 'open'; });

        var c = collect();
        info.textContent = c.items.length + '件を登録します' + (c.skip ? '（登録済み ' + c.skip + '件は除外）' : '') + (c.bad ? '・「毎年◯月◯日」が読み取れない行が ' + c.bad + '件あります' : '');
        ok.disabled = !c.items.length;
      }
      ta.addEventListener('input', upd); upd();
      ok.addEventListener('click', function(){
        var c = collect(); if(!c.items.length) return;
        closeDialog();
        mutate(function(){ c.items.forEach(function(p){ state.tasks.push(makeTask(p, 'all')); }); },
          c.items.length + '件の年間業務を登録しました（46日以上先のものは「先の予定」にまとめて表示）');
      });
      bindClose(d);
    });
}

/* ============================================================
   Theme
   ============================================================ */
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  var th = state.prefs.theme;
  var eff = th === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : th;
  document.documentElement.setAttribute('data-theme', eff);
  document.documentElement.classList.toggle('lite', !!state.prefs.lite);
  el.themeBtn.innerHTML = icon(th === 'dark' ? 'moon' : th === 'light' ? 'sun' : 'auto');
  el.themeBtn.title = '表示テーマ：' + ({ auto:'自動', light:'ライト', dark:'ダーク' })[th];
}
if(mq && mq.addEventListener) mq.addEventListener('change', function(){ if(state.prefs.theme === 'auto') applyTheme(); });
el.themeBtn.addEventListener('click', function(){
  var order = ['auto','light','dark'];
  state.prefs.theme = order[(order.indexOf(state.prefs.theme) + 1) % 3];
  persist(); applyTheme();
  toast('表示テーマ：' + ({ auto:'自動（PCの設定に合わせる）', light:'ライト（霧と青空）', dark:'ダーク（夜霧と星空）' })[state.prefs.theme]);
});

/* ============================================================
   Navigation helpers
   ============================================================ */
function setView(v){
  if(!VIEWS[v]) return;
  state.prefs.view = v;
  persist(); closeMenu(false); render(); updatePreview();
}
function setGroupBy(g){
  state.prefs.groupBy = g;
  state.prefs.view = 'all';
  persist(); render();
}
function rowEl(id){ return el.list.querySelector('.task[data-id="' + id + '"]'); }
function rows(){ return Array.prototype.slice.call(el.list.querySelectorAll('.task')); }
function flashRow(id){
  var r = rowEl(id); if(!r) return;
  r.classList.remove('flash'); r.offsetWidth; r.classList.add('flash');
  r.scrollIntoView({ block:'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
}

/* ============================================================
   Events
   ============================================================ */
el.nav.addEventListener('click', function(e){ var b = e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
el.focusBtn.addEventListener('click', openFocus);
el.morningBtn.addEventListener('click', function(){ openMorning(); });
el.reviewBtn.addEventListener('click', reviewDialog);
el.picks.addEventListener('click', function(e){
  var b = e.target.closest('[data-pk]'); if(!b) return;
  var a = b.dataset.pk;
  if(a === 'choose') openMorning('pick');
  else if(a === 'focus') openFocus();
  else if(a === 'toggle'){ var r = b.closest('[data-id]'); if(r) toggleDone(r.dataset.id, null); }
});
el.morning.addEventListener('click', function(e){
  var b = e.target.closest('[data-mg]'); if(!b || b.disabled) return;
  var a = b.dataset.mg;
  if(a === 'close') closeMorning();
  else if(a === 'topick'){ M.phase = 'pick'; initPick(); renderMorning(); }
  else if(a === 'drop'){ M.chosen = M.chosen.filter(function(id){ return id !== b.dataset.id; }); renderMorning(); }
  else if(a === 'add'){ if(M.chosen.length >= 5){ toast('欲張らず、5つまでにしておきましょう'); return; } M.chosen.push(b.dataset.id); renderMorning(); }
  else if(a === 'decide') decidePicks(false);
  else if(a === 'focus') decidePicks(true);
  else morningAct(a);
});
el.preview.addEventListener('click', function(e){
  var b = e.target.closest('[data-pm]'); if(!b) return;
  mailMode = b.dataset.pm === 'mail';
  updatePreview(); el.input.focus();
});
el.settingsBtn.addEventListener('click', settingsDialog);
el.helpBtn.addEventListener('click', helpDialog);
el.backupNote.addEventListener('click', function(){ if(storageOK) exportData(); else settingsDialog(); });

el.input.addEventListener('input', function(){ autosize(); updatePreview(); });
el.input.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); addFromInput(); updatePreview(); }
  else if(e.key === 'Escape'){ if(el.input.value){ el.input.value = ''; autosize(); updatePreview(); } else el.input.blur(); }
  else if(e.key === 'ArrowDown' && !el.input.value){ var r = rows()[0]; if(r){ e.preventDefault(); r.focus(); } }
});

el.insight.addEventListener('click', function(e){
  var b = e.target.closest('[data-ins]'); if(!b) return;
  var a = b.dataset.ins;
  if(a === 'close'){ insight = null; renderInsight(); }
  else if(a === 'rel') setGroupBy('rel');
  else if(a === 'cat') catDialog(b.dataset.id);
  else if(a === 'merge') mergeInto(b.dataset.id, b.dataset.into);
});
el.insight.addEventListener('change', function(e){
  var cb = e.target.closest('[data-sub]'); if(!cb || !insight) return;
  var rep = insight.reports[0], parent = byId(rep.id); if(!parent) return;
  var s = rep.subs[+cb.dataset.sub];
  if(cb.checked){
    var c = makeChild(parent, s, +cb.dataset.sub);
    state.tasks.push(c); justAdded[c.id] = 1; s.childId = c.id;
  }else if(s.childId){
    var id = s.childId;
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    s.childId = null;
  }
  persist(); render();
});

el.banner.addEventListener('click', function(e){
  var b = e.target.closest('[data-bulk]'); if(!b) return;
  var over = overdueTasks();
  if(b.dataset.bulk === 'dismiss'){ state.prefs.bannerDismissed = todayStr(); persist(); renderBanner(); return; }
  if(b.dataset.bulk === 'review'){ reviewDialog(); return; }
  if(b.dataset.bulk === 'review-dismiss'){ state.prefs.lastReview = todayStr(); persist(); renderBanner(); return; }
  var d = b.dataset.bulk === 'today' ? todayStr() : ymd(addDays(today(), 1));
  mutate(function(){ over.forEach(function(t){ t.due = d; if(t.parentId) t.dueManual = true; }); }, over.length + '件を' + (b.dataset.bulk === 'today' ? '今日' : '明日') + 'に移動しました');
});

el.viewTools.addEventListener('click', function(e){
  var b = e.target.closest('[data-copy]'); if(b){ copyReport(b.dataset.copy); return; }
  if(e.target.closest('[data-print]')){ printList(); return; }
  var g = e.target.closest('[data-gb]'); if(g) setGroupBy(g.dataset.gb);
});

el.list.addEventListener('click', function(e){
  var copy = e.target.closest('[data-copy]');
  if(copy){ e.stopPropagation(); copyReport(copy.dataset.copy, copy.dataset.day); return; }
  var g = e.target.closest('[data-group]');
  if(g){
    state.prefs.collapsed[collapseKey(g.dataset.group)] = !isCollapsed(g.dataset.group);
    persist(); renderView(); return;
  }
  var ex = e.target.closest('[data-example]');
  if(ex){ el.input.value = ex.dataset.example; autosize(); updatePreview(); el.input.focus(); return; }

  var b = e.target.closest('[data-act]'); if(!b) return;
  var row = b.closest('.task'); if(!row) return;
  var id = row.dataset.id, act = b.dataset.act, T = today();
  if(act === 'toggle') toggleDone(id, row);
  else if(act === 'edit') startEdit(row);
  else if(act === 'today') setDue(id, T, '今日');
  else if(act === 'tomorrow') setDue(id, addDays(T,1), '明日');
  else if(act === 'reply') replyCame(id);
  else if(act === 'note') toggleNote(id);
  else if(act === 'cat') catDialog(id);
  else if(act === 'subs') subsDialog(id);
  else if(act === 'menu'){ if(!el.menu.hidden && menuFor === id) closeMenu(true); else openMenu(b, id); }
});

el.list.addEventListener('keydown', function(e){
  if(e.target.matches('input,textarea')){
    if(e.key === 'Escape' && e.target.dataset.note){ var id0 = e.target.dataset.note; persist(); openNotes[id0] = false; renderView(); var r0 = rowEl(id0); if(r0) r0.focus(); }
    return;
  }
  var row = e.target.closest('.task'); if(!row || e.target !== row) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var id = row.dataset.id, list = rows(), i = list.indexOf(row), T = today();
  var focusAfter = function(){ var r = rowEl(id) || rows()[Math.min(i, rows().length - 1)]; if(r) r.focus(); };
  var t = byId(id);
  switch(e.key){
    case 'ArrowDown': case 'j': e.preventDefault(); if(list[i+1]) list[i+1].focus(); break;
    case 'ArrowUp': case 'k': e.preventDefault(); if(list[i-1]) list[i-1].focus(); else el.input.focus(); break;
    case 'x': case ' ': e.preventDefault(); toggleDone(id, row); setTimeout(focusAfter, 900); break;
    case 't': setDue(id, T, '今日'); focusAfter(); break;
    case 'm': setDue(id, addDays(T,1), '明日'); focusAfter(); break;
    case 'd': dateDialog(id); break;
    case 's': subsDialog(t.parentId && byId(t.parentId) ? t.parentId : id); break;
    case 'c': catDialog(id); break;
    case 'u': toggleUrgent(id); focusAfter(); break;
    case 'w': if(t.status === 'waiting') replyCame(id); else waitDialog(id); break;
    case 'n': e.preventDefault(); toggleNote(id); break;
    case 'e': case 'Enter': e.preventDefault(); startEdit(row); break;
    case '.': e.preventDefault(); openMenu(row.querySelector('[data-act="menu"]'), id); break;
    case 'Delete': case 'Backspace': e.preventDefault(); removeTask(id); focusAfter(); break;
    default: return;
  }
  e.stopPropagation();
});

document.addEventListener('keydown', function(e){
  if(el.dlg.open) return;
  if(!el.morning.hidden){ morningKey(e); return; }
  if(!el.focus.hidden){
    if(e.key === 'Escape'){ e.preventDefault(); closeFocus(); }
    else if(e.key === 'Enter' && !e.target.closest('[data-f],[data-timer]')){ e.preventDefault(); focusDone(); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); focusSkip(); }
    return;
  }
  var a = document.activeElement;
  var typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); undo(); return; }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'Escape' && !el.menu.hidden){ closeMenu(true); return; }
  if(e.key === 'n' || e.key === '/'){ e.preventDefault(); el.input.focus(); }
  else if(e.key === 'f'){ e.preventDefault(); openFocus(); }
  else if(e.key === 'o'){ e.preventDefault(); openMorning(); }
  else if(e.key === 'r'){ e.preventDefault(); reviewDialog(); }
  else if(e.key === 'p'){ e.preventDefault(); printList(); }
  else if(e.key === 'v'){ var o = ['due','cat','rel']; setGroupBy(o[(o.indexOf(state.prefs.groupBy) + 1) % 3]); }
  else if(e.key === '?'){ e.preventDefault(); helpDialog(); }
  else if(/^[1-5]$/.test(e.key)){ setView(VIEW_ORDER[+e.key - 1]); }
  else if((e.key === 'j' || e.key === 'ArrowDown') && (!a || a === document.body)){ var r = rows()[0]; if(r){ e.preventDefault(); r.focus(); } }
});

// Other tabs / windows editing the same data
window.addEventListener('storage', function(e){
  if(e.key !== STORE_KEY && e.key !== PREF_KEY) return;
  state.tasks = load(STORE_KEY, []);
  state.prefs = Object.assign(state.prefs, load(PREF_KEY, {}));
  if(!editing) render();
});

// Day rollover while the page stays open
var lastDay = todayStr();
setInterval(function(){
  if(todayStr() !== lastDay){
    lastDay = todayStr(); render();
    if(shouldAutoMorning() && el.morning.hidden && el.focus.hidden && !el.dlg.open) openMorning();
  }
  else { renderHeader(); renderBanner(); }
}, 60000);

/* ============================================================
   Boot
   ============================================================ */
if(!VIEWS[state.prefs.view]) state.prefs.view = 'all';
if(['due','cat','rel'].indexOf(state.prefs.groupBy) < 0) state.prefs.groupBy = 'due';
render();
updatePreview();
autosize();
if(!storageOK) toast('この環境ではブラウザ保存が使えません。「書き出し」でこまめに保存してください');
if(shouldAutoMorning()) openMorning();
else setTimeout(function(){ el.input.focus(); }, 50);

// Exposed for tests only
window.__sakutto = {
  parse: parse, state: state, nextOccurrence: nextOccurrence, ymd: ymd,
  categorize: categorize, topics: topics, matchRule: matchRule, clusterTasks: clusterTasks,
  similarity: similarity, parseRules: parseRules,
  extractMail: extractMail, looksLikeMail: looksLikeMail, scoreTask: scoreTask, suggestPicks: suggestPicks,
  categorizeInfo: categorizeInfo, firstOccurrence: firstOccurrence,
};
})();
</script>
